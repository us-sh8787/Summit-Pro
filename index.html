const storage = {
    get: async (key) => {
        try { const r = await window.storage.get(key); return r ? JSON.parse(r.value) : null; }
        catch { const v = localStorage.getItem(key); return v ? JSON.parse(v) : null; }
    },
    set: async (key, value) => {
        try { await window.storage.set(key, JSON.stringify(value)); } catch {}
        localStorage.setItem(key, JSON.stringify(value));
    },
    list: async (prefix) => {
        try { const r = await window.storage.list(prefix); return r ? r.keys : []; }
        catch { return []; }
    }
};

// ── INIT ──────────────────────────────────────────────────────────────────────
async function init() {
    const [workouts, habits, program] = await Promise.all([
        storage.get('sp2-workouts'),
        storage.get('sp2-habits'),
        storage.get('sp2-program')
    ]);

    state.workouts = workouts || [];
    state.program = program || DEFAULT_PROGRAM;

    state.habits = habits || [
        { name: '💧 100oz Water', frequency: 'Daily', target: 1, completions: [] },
        { name: '📖 Read 10 Pages / 15 Min', frequency: 'Daily', target: 1, completions: [] },
        { name: '☀️ 20 Min Sunlight', frequency: 'Daily', target: 1, completions: [] },
        { name: '❤️ Show Wife Affection', frequency: 'Daily', target: 1, completions: [] },
        { name: '💪 Resistance Training', frequency: 'Weekly', target: 3, completions: [] },
        { name: '🎾 Zone 2 (Tennis/Cardio)', frequency: 'Weekly-Range', target: 1, completions: [], weeklyRange: {} },
        { name: '⚡ Zone 5 Cardio', frequency: 'Weekly', target: 1, completions: [] },
        { name: '🧘 Morning Routine (Breathwork, Meditation, Prayer, Gratitude)', frequency: 'Weekly', target: 5, completions: [] },
        { name: '🍎 Track Macros & Follow Food Rules', frequency: 'Weekly', target: 6, completions: [] }
    ];

    if (!habits) await storage.set('sp2-habits', state.habits);
    if (!program) await storage.set('sp2-program', state.program);

    render();
}

function save() {
    storage.set('sp2-workouts', state.workouts);
    storage.set('sp2-habits', state.habits);
    storage.set('sp2-program', state.program);
}

// ── WEEK / PROGRAM UTILS ──────────────────────────────────────────────────────
function getCurrentWeek() {
    if (!state.program?.startDate) return 1;
    const start = new Date(state.program.startDate);
    const startMon = new Date(start);
    startMon.setDate(start.getDate() - start.getDay() + 1);
    startMon.setHours(0,0,0,0);
    const nowMon = new Date();
    nowMon.setDate(nowMon.getDate() - nowMon.getDay() + 1);
    nowMon.setHours(0,0,0,0);
    const diff = Math.floor((nowMon - startMon) / (1000*60*60*24*7));
    return (diff % (state.program.duration || 6)) + 1;
}

function getWeekDates() {
    const now = new Date();
    const week = [];
    const diff = now.getDate() - now.getDay();
    for (let i = 0; i < 7; i++) {
        const d = new Date(now); d.setDate(diff + i);
        week.push(d.toDateString());
    }
    return week;
}

function getLastWorkout(dayName) {
    return state.workouts
        .filter(w => w.day === dayName)
        .sort((a,b) => new Date(b.date) - new Date(a.date))[0] || null;
}

                                        ${done ? '<span class="text-xs px-2 py-0.5 rounded-full font-medium" style="background:#1a2e00; color:#c8f542;">✓ Done</span>' : ''}
                                    </div>
                                    <div class="text-xs mt-1" style="color:#555">${details?.dayLabel || ''} · ${details ? totalExercises(details) + ' exercises' : ''}</div>
                                    ${last ? `<div class="text-xs mt-1" style="color:#444">Last: ${new Date(last.date).toLocaleDateString()}</div>` : ''}
                                </div>
                                <button onclick="startDay('${day}')" class="px-4 py-2 rounded-lg text-sm font-bold ml-3"
                                    style="background:${done ? '#1a1a1a' : dc}; color:${done ? dc : '#000'}; border:1px solid ${dc};">
                                    ${done ? 'Redo' : 'Start'}
                                </button>
                            </div>`;
                    }).join('')}
                </div>
            </div>

            <div class="grid grid-cols-2 gap-2 mb-4">
                <button onclick="showHistory()" class="py-3 rounded-lg text-sm font-medium" style="background:#161616; color:#888; border:1px solid #242424;">
                    📅 History
                </button>
                <button onclick="startCustom()" class="py-3 rounded-lg text-sm font-medium" style="background:#161616; color:#888; border:1px solid #242424;">
                    ➕ Custom
                </button>
            </div>

            ${recentWorkoutsList()}
        </div>`;
}

function totalExercises(details) {
    return details.blocks.reduce((sum, b) => sum + b.exercises.length, 0);
}

function recentWorkoutsList() {
    const recent = state.workouts.slice(-4).reverse();
    if (!recent.length) return '';
    return `
        <div>
            <h3 class="text-xs font-bold mb-2" style="color:#555; letter-spacing:2px;">RECENT</h3>
            <div class="space-y-2">
                ${recent.map(w => `
                    <div class="rounded-lg p-3 flex justify-between items-center" style="background:#161616; border:1px solid #242424;">
                        <div>
                            <div class="text-sm font-medium">${w.day}</div>
                            <div class="text-xs" style="color:#555">${new Date(w.date).toLocaleDateString()} · Week ${w.week}</div>
                        </div>
                        <div class="text-xs" style="color:#555">${w.exercises?.length || 0} ex</div>
                    </div>`).join('')}
            </div>
        </div>`;
}

// ── START WORKOUT ─────────────────────────────────────────────────────────────
function startDay(dayName) {
    const details = state.program?.programDetails?.[dayName];
    if (!details) return;

    const last = getLastWorkout(dayName);
    const exercises = [];

    details.blocks.forEach(block => {
        block.exercises.forEach(ex => {
            const lastEx = last?.exercises?.find(e => e.name === ex.name);
            if (ex.isCheckbox) {
                exercises.push({
                    name: ex.name,
                    isCheckbox: true,
                    blockLabel: block.label,
                    blockType: block.type,
                    sets: Array(ex.sets).fill(null).map(() => ({ checked: false })),
                    templateNotes: ex.notes,
                    detail: ex.reps,
                    restSeconds: ex.rest,
                    notes: lastEx?.notes || ''
                });
            } else {
                const sets = [];
                for (let i = 0; i < ex.sets; i++) {
                    sets.push({
                        weight: lastEx?.sets?.[i]?.weight || '',
                        reps: lastEx?.sets?.[i]?.reps || '',
                        done: false
                    });
                }
                exercises.push({
                    name: ex.name,
                    isCheckbox: false,
                    blockLabel: block.label,
                    blockType: block.type,
                    sets,
                    templateNotes: ex.notes,
                    targetReps: ex.reps,
                    restSeconds: ex.rest,
                    notes: lastEx?.notes || '',
                    lastNotes: lastEx?.notes || null
                });
            }
        });
    });

    state.currentWorkout = {
        day: dayName,
        date: new Date().toISOString(),
        week: getCurrentWeek(),
        exercises,
        warmup: details.warmup
    };
    render();
}

function startCustom() {
    const name = prompt('Workout name:');
    if (!name) return;
    state.currentWorkout = {
        day: name, date: new Date().toISOString(), week: getCurrentWeek(),
        exercises: [], warmup: []
    };
    render();
}

function restTimerHTML() {
    const { remaining, total } = state.activeTimer;
    const prog = ((total - remaining) / total) * 283;
    const m = Math.floor(remaining / 60);
    const s = remaining % 60;
    return `
        <div class="rounded-lg p-4 mb-4 timer-pulse" style="background:#161616; border:1px solid #42c8f5;">
            <div class="flex items-center justify-between">
                <span class="text-sm font-bold" style="color:#42c8f5;">REST TIMER</span>
                <button onclick="stopTimer()" class="text-xs px-3 py-1 rounded" style="color:#f00; background:#1a0000; border:1px solid #300;">Stop</button>
            </div>
            <div class="flex items-center justify-center mt-2" style="position:relative; height:80px;">
                <svg width="80" height="80" style="position:absolute; transform:rotate(-90deg)">
                    <circle cx="40" cy="40" r="35" stroke="#242424" stroke-width="6" fill="none"/>
                    <circle cx="40" cy="40" r="35" stroke="#42c8f5" stroke-width="6" fill="none"
                        stroke-dasharray="220" stroke-dashoffset="${220 - (prog * 220/283)}"
                        style="transition:stroke-dashoffset 1s linear;"/>
                </svg>
                <div class="text-2xl font-black" style="color:#42c8f5; position:relative;">${m}:${s.toString().padStart(2,'0')}</div>
            </div>
        </div>`;
}

// ── TIMER ─────────────────────────────────────────────────────────────────────
function startTimer(seconds) {
    if (state.activeTimer?.interval) clearInterval(state.activeTimer.interval);
    state.activeTimer = { total: seconds, remaining: seconds, interval: null };
    state.activeTimer.interval = setInterval(() => {
        state.activeTimer.remaining--;
        if (state.activeTimer.remaining <= 0) {
            stopTimer();
            // Vibrate if available
            if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
        } else {
            // Just re-render the timer portion
            const timerEl = document.querySelector('.timer-pulse');
            if (timerEl) {
                const { remaining, total } = state.activeTimer;
                const prog = ((total - remaining) / total) * 283;
                const m = Math.floor(remaining / 60);
                const s = remaining % 60;
                timerEl.innerHTML = `
                    <div class="flex items-center justify-between">
                        <span class="text-sm font-bold" style="color:#42c8f5;">REST TIMER</span>
                        <button onclick="stopTimer()" class="text-xs px-3 py-1 rounded" style="color:#f00; background:#1a0000; border:1px solid #300;">Stop</button>
                    </div>
                    <div class="flex items-center justify-center mt-2" style="position:relative; height:80px;">
                        <svg width="80" height="80" style="position:absolute; transform:rotate(-90deg)">
                            <circle cx="40" cy="40" r="35" stroke="#242424" stroke-width="6" fill="none"/>
                            <circle cx="40" cy="40" r="35" stroke="#42c8f5" stroke-width="6" fill="none"
                                stroke-dasharray="220" stroke-dashoffset="${220 - (prog * 220/283)}"
                                style="transition:stroke-dashoffset 1s linear;"/>
                        </svg>
                        <div class="text-2xl font-black" style="color:#42c8f5; position:relative;">${m}:${s.toString().padStart(2,'0')}</div>
                    </div>`;
            }
        }
    }, 1000);
    render();
}

function stopTimer() {
    if (state.activeTimer?.interval) clearInterval(state.activeTimer.interval);
    state.activeTimer = null;
    render();
}

// ── WORKOUT ACTIONS ───────────────────────────────────────────────────────────
function toggleCheck(exIdx, setIdx) {
    state.currentWorkout.exercises[exIdx].sets[setIdx].checked =
        !state.currentWorkout.exercises[exIdx].sets[setIdx].checked;
    // Auto start rest timer
    const ex = state.currentWorkout.exercises[exIdx];
    if (ex.sets[setIdx].checked && ex.restSeconds > 0) startTimer(ex.restSeconds);
    else render();
}

function markSetDone(exIdx, setIdx) {
    const ex = state.currentWorkout.exercises[exIdx];
    ex.sets[setIdx].done = !ex.sets[setIdx].done;
    if (ex.sets[setIdx].done && ex.restSeconds > 0) startTimer(ex.restSeconds);
    else render();
}

function updateSet(exIdx, setIdx, field, value) {
    state.currentWorkout.exercises[exIdx].sets[setIdx][field] = value;
}

function updateExNotes(exIdx, val) {
    state.currentWorkout.exercises[exIdx].notes = val;
}

function addSet(exIdx) {
    const ex = state.currentWorkout.exercises[exIdx];
    ex.sets.push({ weight: ex.sets[ex.sets.length-1]?.weight || '', reps: '', done: false });
    render();
}

function editExName(exIdx) {
    const ex = state.currentWorkout.exercises[exIdx];
    const name = prompt('Edit exercise name:', ex.name);
    if (name?.trim()) { ex.name = name.trim(); render(); }
}

function addExercise() {
    const name = prompt('Exercise name:');
    if (!name) return;
    state.currentWorkout.exercises.push({
        name, isCheckbox: false, blockLabel: 'CUSTOM', blockType: 'superset',
        sets: [{ weight: '', reps: '', done: false }],
        templateNotes: '', targetReps: '', restSeconds: 60, notes: ''
    });
    render();
}

async function finishWorkout() {
    if (!confirm('Finish workout?')) return;
    state.workouts.push({ ...state.currentWorkout });
    state.currentWorkout = null;
    stopTimer();
    await storage.set('sp2-workouts', state.workouts);
    render();
}

function cancelWorkout() {
    if (confirm('Cancel workout? Progress will be lost.')) {
        state.currentWorkout = null;
        stopTimer();
        render();
    }
}

// ── HISTORY ───────────────────────────────────────────────────────────────────

    const overlay = document.createElement('div');
    overlay.className = 'fixed inset-0 z-50 overflow-y-auto overlay-bg';
    overlay.innerHTML = `
        <div class="min-h-screen p-4">
            <div class="max-w-2xl mx-auto rounded-xl overflow-hidden" style="background:#111; border:1px solid #242424;">
                <div class="sticky top-0 px-5 py-4 flex justify-between items-center" style="background:#161616; border-bottom:1px solid #242424;">
                    <h2 class="text-lg font-black" style="color:#c8f542;">WORKOUT HISTORY</h2>
                    <button onclick="this.closest('.fixed').remove()" class="text-2xl" style="color:#555;">×</button>
                </div>
                <div class="p-4 space-y-4">
                    ${Object.keys(byDay).map(day => `
                        <div>
                            <h3 class="text-xs font-bold mb-2" style="color:#c8f542; letter-spacing:2px;">${day.toUpperCase()}</h3>

                                    <div class="flex justify-between items-start mb-3">

                                            <div class="text-sm font-bold">${new Date(w.date).toLocaleDateString('en-US', {weekday:'short', month:'short', day:'numeric'})}</div>

                                        <div class="mb-2">

                                            <div class="text-xs" style="color:#555">${e.sets.filter(s=>s.weight||s.reps).map(s=>`${s.weight||'?'}lbs×${s.reps||'?'}`).join(' · ')}</div>

                                        </div>`).join('') || ''}
                                </div>`).join('')}
                        </div>`).join('') || '<div class="text-center py-8" style="color:#555">No workouts logged yet</div>'}
                </div>
            </div>
        </div>`;
    document.body.appendChild(overlay);
}

// ── DASHBOARD ─────────────────────────────────────────────────────────────────
function dashboardView() {
    const weekDates = getWeekDates();
    const thisWeek = state.workouts.filter(w => weekDates.includes(new Date(w.date).toDateString()));

    // PRs
    const prs = {};
    state.workouts.forEach(w => {
        w.exercises?.forEach(ex => {
            if (ex.isCheckbox) return;
            ex.sets?.forEach(s => {
                if (s.weight && s.reps) {
                    const vol = parseFloat(s.weight) * parseFloat(s.reps);
                    if (!prs[ex.name] || vol > prs[ex.name].vol) {
                        prs[ex.name] = { weight: s.weight, reps: s.reps, vol, date: w.date };
                    }
                }
            });
        });
    });
    const prList = Object.entries(prs).sort((a,b) => new Date(b[1].date)-new Date(a[1].date)).slice(0, 6);

    // Streak
    let streak = 0;
    const sorted = [...state.workouts].sort((a,b) => new Date(b.date)-new Date(a.date));
    const seenWeeks = new Set();
    sorted.forEach(w => {
        const wk = getISOWeek(new Date(w.date));
        seenWeeks.add(wk);
    });

    return `
        <div class="p-4">
            <h2 class="text-xs font-bold mb-4" style="color:#555; letter-spacing:2px;">PERFORMANCE</h2>

            <div class="grid grid-cols-3 gap-3 mb-4">
                <div class="rounded-lg p-3 text-center" style="background:#161616; border:1px solid #242424;">
                    <div class="text-2xl font-black" style="color:#c8f542">${thisWeek.length}</div>
                    <div class="text-xs mt-1" style="color:#555">This Week</div>
                </div>
                <div class="rounded-lg p-3 text-center" style="background:#161616; border:1px solid #242424;">
                    <div class="text-2xl font-black" style="color:#42c8f5">${state.workouts.length}</div>
                    <div class="text-xs mt-1" style="color:#555">Total</div>
                </div>
                <div class="rounded-lg p-3 text-center" style="background:#161616; border:1px solid #242424;">
                    <div class="text-2xl font-black" style="color:#f57c42">${seenWeeks.size}</div>
                    <div class="text-xs mt-1" style="color:#555">Weeks Active</div>
                </div>
            </div>

            ${prList.length ? `
                <div class="rounded-lg overflow-hidden mb-4" style="border:1px solid #242424;">
                    <div class="px-4 py-3" style="background:#1a2e00; border-bottom:1px solid #242424;">
                        <span class="text-xs font-bold" style="color:#c8f542; letter-spacing:2px;">🏆 PERSONAL RECORDS</span>
                    </div>
                    <div class="divide-y" style="border-color:#242424;">
                        ${prList.map(([name, pr]) => `
                            <div class="px-4 py-3 flex justify-between items-center">
                                <div>
                                    <div class="text-sm font-medium">${name}</div>
                                    <div class="text-xs" style="color:#555">${new Date(pr.date).toLocaleDateString()}</div>
                                </div>
                                <div class="text-right">
                                    <div class="font-black" style="color:#c8f542">${pr.weight}lbs</div>
                                    <div class="text-xs" style="color:#555">${pr.reps} reps</div>
                                </div>
                            </div>`).join('')}
                    </div>
                </div>` : ''}

            <!-- Volume by day type -->
            <div class="rounded-lg overflow-hidden" style="border:1px solid #242424;">
                <div class="px-4 py-3" style="background:#161616; border-bottom:1px solid #242424;">
                    <span class="text-xs font-bold" style="color:#888; letter-spacing:2px;">SESSIONS BY TYPE</span>
                </div>
                <div class="p-4 space-y-3">
                    ${(state.program?.split || []).map(day => {
                        const count = state.workouts.filter(w => w.day === day).length;
                        const max = Math.max(...(state.program?.split||[]).map(d => state.workouts.filter(w=>w.day===d).length), 1);
                        const pct = max > 0 ? (count/max)*100 : 0;
                        const dc = { 'Upper Body':'#c8f542','Lower Body':'#42c8f5','Full Body + Functional':'#f57c42','Mobility + Flow':'#b842f5' }[day] || '#888';
                        return `
                            <div>
                                <div class="flex justify-between text-xs mb-1">
                                    <span style="color:#888">${day}</span>
                                    <span style="color:${dc}; font-weight:bold;">${count}</span>
                                </div>
                                <div class="h-1.5 rounded-full" style="background:#242424;">
                                    <div class="h-full rounded-full transition-all" style="width:${pct}%; background:${dc};"></div>
                                </div>
                            </div>`;
                    }).join('')}
                </div>
            </div>
        </div>`;
}

function getISOWeek(date) {
    const d = new Date(date);
    d.setHours(0,0,0,0);
    d.setDate(d.getDate() + 3 - (d.getDay() + 6) % 7);
    const week1 = new Date(d.getFullYear(), 0, 4);
    return `${d.getFullYear()}-${Math.round(((d - week1) / 86400000 - 3 + (week1.getDay() + 6) % 7) / 7) + 1}`;
}

// ── HABITS ────────────────────────────────────────────────────────────────────
function habitsView() {
    const today = new Date().toDateString();
    const weekDates = getWeekDates();

    return `
        <div class="p-4">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xs font-bold" style="color:#555; letter-spacing:2px;">HABITS</h2>
                <button onclick="addHabit()" class="text-xs px-3 py-1.5 rounded-lg font-bold" style="background:#c8f542; color:#000;">+ Add</button>
            </div>

            <div class="space-y-2">
                ${state.habits.map((habit, i) => renderHabit(habit, i, today, weekDates)).join('')}
            </div>
        </div>`;
}

function renderHabit(habit, i, today, weekDates) {
    if (habit.frequency === 'Weekly-Range') {
        // Zone 2 range habit
        const thisWeek = `${weekDates[0]}`;
        const currentRange = habit.weeklyRange?.[thisWeek] || null;
        const ranges = ['<120 min', '120–180 min', '181+ min'];
        const done = currentRange !== null;
        return `
            <div class="rounded-lg p-4" style="background:#161616; border:1px solid ${done ? '#c8f542' : '#242424'};">
                <div class="flex items-start justify-between mb-3">
                    <div>
                        <div class="font-medium text-sm">${habit.name}</div>
                        <div class="text-xs mt-0.5" style="color:#555">Weekly · Zone 2 Minutes</div>
                    </div>
                    <button onclick="removeHabit(${i})" class="text-xs" style="color:#333;">×</button>
                </div>
                <div class="flex gap-2">
                    ${ranges.map((r, ri) => `
                        <button onclick="setZone2Range(${i}, '${r}')"
                            class="flex-1 py-2 rounded-lg text-xs font-bold transition-all"
                            style="${currentRange === r ? 'background:#c8f542; color:#000;' : 'background:#1a1a1a; color:#555; border:1px solid #333;'}">
                            ${r}
                        </button>`).join('')}
                </div>
                ${currentRange ? `<div class="text-xs mt-2" style="color:#6a8a00">✓ This week: ${currentRange}</div>` : ''}
            </div>`;
    }

    const isDaily = habit.frequency === 'Daily';
    const doneToday = habit.completions?.includes(today);
    const weekCount = weekDates.filter(d => habit.completions?.includes(d)).length;
    const goalMet = isDaily ? doneToday : weekCount >= habit.target;

    return `
        <div class="rounded-lg p-4" style="background:#161616; border:1px solid ${goalMet ? '#c8f542' : '#242424'};">
            <div class="flex items-center justify-between">
                <div class="flex-1">
                    <div class="font-medium text-sm">${habit.name}</div>
                    <div class="text-xs mt-0.5" style="color:#555">
                        ${isDaily ? (doneToday ? '✓ Done today' : 'Not done today') : `${weekCount}/${habit.target} this week`}
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    ${!isDaily ? '' : ''}
                    <button onclick="toggleHabit(${i})"
                        class="w-10 h-10 rounded-lg font-bold text-lg transition-all"
                        style="${(isDaily ? doneToday : false) ? 'background:#c8f542; color:#000;' : 'background:#1a1a1a; color:#555; border:1px solid #333;'}">
                        ${(isDaily && doneToday) ? '✓' : '○'}
                    </button>
                    <button onclick="removeHabit(${i})" class="text-xs" style="color:#333;">×</button>
                </div>
            </div>
            ${!isDaily ? `
                <div class="flex gap-1 mt-3">
                    ${weekDates.map((d, di) => {
                        const done = habit.completions?.includes(d);
                        const isToday = d === new Date().toDateString();
                        return `<button onclick="toggleHabitDate(${i},'${d}')"
                            class="flex-1 py-1.5 rounded text-xs font-bold"
                            style="${done ? 'background:#c8f542; color:#000;' : isToday ? 'background:#1a2e00; color:#6a8a00; border:1px solid #c8f542;' : 'background:#1a1a1a; color:#333;'}">
                            ${['S','M','T','W','T','F','S'][di]}
                        </button>`;
                    }).join('')}
                </div>` : ''}
        </div>`;
}

function setZone2Range(idx, range) {
    const weekDates = getWeekDates();
    const weekKey = weekDates[0];
    if (!state.habits[idx].weeklyRange) state.habits[idx].weeklyRange = {};
    if (state.habits[idx].weeklyRange[weekKey] === range) {
        delete state.habits[idx].weeklyRange[weekKey];
    } else {
        state.habits[idx].weeklyRange[weekKey] = range;
        if (!state.habits[idx].completions) state.habits[idx].completions = [];
        if (!state.habits[idx].completions.includes(weekKey)) state.habits[idx].completions.push(weekKey);
    }
    save();
    render();
}

function toggleHabit(i) {
    const today = new Date().toDateString();
    if (!state.habits[i].completions) state.habits[i].completions = [];
    const idx = state.habits[i].completions.indexOf(today);
    if (idx > -1) state.habits[i].completions.splice(idx, 1);
    else state.habits[i].completions.push(today);
    save();
    render();
}

function toggleHabitDate(i, date) {
    if (!state.habits[i].completions) state.habits[i].completions = [];
    const idx = state.habits[i].completions.indexOf(date);
    if (idx > -1) state.habits[i].completions.splice(idx, 1);
    else state.habits[i].completions.push(date);
    save();
    render();
}

function removeHabit(i) {
    if (confirm('Remove habit?')) {
        state.habits.splice(i, 1);
        save();
        render();
    }
}

function addHabit() {
    const overlay = document.createElement('div');
    overlay.className = 'fixed inset-0 z-50 flex items-center justify-center p-4 overlay-bg';
    overlay.innerHTML = `
        <div class="w-full max-w-md rounded-xl p-6" style="background:#161616; border:1px solid #333;">
            <h3 class="text-lg font-black mb-4" style="color:#c8f542;">ADD HABIT</h3>
            <input type="text" id="h-name" placeholder="Habit name" class="w-full px-3 py-2 rounded-lg mb-3 text-sm" style="background:#1a1a1a; border:1px solid #333; color:#e8e8e8;">
            <select id="h-freq" onchange="document.getElementById('h-target-wrap').style.display=this.value==='Weekly'?'block':'none'"
                class="w-full px-3 py-2 rounded-lg mb-3 text-sm" style="background:#1a1a1a; border:1px solid #333; color:#e8e8e8;">
                <option value="Daily">Daily</option>
                <option value="Weekly">Weekly</option>
            </select>
            <div id="h-target-wrap" style="display:none;" class="mb-3">
                <input type="number" id="h-target" value="5" min="1" max="7" placeholder="Weekly target"
                    class="w-full px-3 py-2 rounded-lg text-sm" style="background:#1a1a1a; border:1px solid #333; color:#e8e8e8;">
            </div>
            <div class="flex gap-3">
                <button onclick="saveHabit()" class="flex-1 py-2 rounded-lg font-bold text-sm" style="background:#c8f542; color:#000;">Add</button>
                <button onclick="this.closest('.fixed').remove()" class="flex-1 py-2 rounded-lg text-sm" style="background:#1a1a1a; color:#888; border:1px solid #333;">Cancel</button>
            </div>
        </div>`;
    document.body.appendChild(overlay);
}

function saveHabit() {
    const name = document.getElementById('h-name').value;
    const freq = document.getElementById('h-freq').value;
    const target = freq === 'Weekly' ? parseInt(document.getElementById('h-target').value) : 1;
    if (!name) { alert('Enter a name'); return; }
    state.habits.push({ name, frequency: freq, target, completions: [] });
    save();
    document.querySelector('.fixed.inset-0').remove();
    render();
}

function switchView(v) {
    state.view = v;
    render();
}

init();
</script>
</body>
</html>
