                        <div class="mb-4">
                            <label class="block text-sm font-medium mb-2">Training Split</label>
                            <div id="split-days" class="space-y-2">
                                ${(existing.split || ['Day 1']).map((day, i) => `
                                    <input type="text" data-day="${i}" value="${day}"
                                        placeholder="e.g., Upper Body, Lower Body, Push, Pull"
                                        class="w-full border rounded-lg px-3 py-2 split-day">
                                `).join('')}
                            </div>
                            <button onclick="addSplitDay()" class="mt-2 text-blue-600 text-sm font-medium">
                                + Add Day
                            </button>
                        </div>

                        <div class="flex gap-3">
                            <button onclick="saveProgramSetup()" class="flex-1 bg-blue-600 text-white py-2 px-4 rounded-lg font-medium hover:bg-blue-700">
                                Save Program
                            </button>
                            <button onclick="closeOverlay()" class="flex-1 bg-gray-200 text-gray-700 py-2 px-4 rounded-lg font-medium hover:bg-gray-300">
                                Cancel
                            </button>
                        </div>
                    </div>
                </div>
            `;
            document.body.appendChild(overlay);
            overlay.onclick = (e) => {
                if (e.target === overlay) closeOverlay();
            };
        }

        function addSplitDay() {
            const container = document.getElementById('split-days');
            const dayNum = container.querySelectorAll('.split-day').length;
            const input = document.createElement('input');
            input.type = 'text';
            input.className = 'w-full border rounded-lg px-3 py-2 split-day mb-2';
            input.dataset.day = dayNum;
            input.placeholder = 'e.g., Push, Pull, Legs';
            container.appendChild(input);
        }

        async function saveProgramSetup() {
            const name = document.getElementById('program-name').value;
            const duration = parseInt(document.getElementById('program-duration').value);
            const splitInputs = document.querySelectorAll('.split-day');
            const split = Array.from(splitInputs).map(input => input.value).filter(v => v.trim());

            if (!name || !duration || split.length === 0) {
                alert('Please fill in all fields');
                return;
            }

            state.workoutProgram = {
                name,
                duration,
                split,
                startDate: state.workoutProgram?.startDate || new Date().toISOString()
            };

            await saveProgram();
            closeOverlay();
            render();
        }

        function closeOverlay() {
            const overlay = document.querySelector('.fixed.inset-0');
            if (overlay) overlay.remove();
        }

        function startWorkout() {
            const dayOptions = state.workoutProgram 
                ? state.workoutProgram.split.map((day, i) => `<option value="${day}">${day}</option>`).join('')
                : '';

            const overlay = document.createElement('div');
            overlay.className = 'fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 overflow-y-auto';
            overlay.innerHTML = `
                <div class="bg-white rounded-lg max-w-2xl w-full my-8">
                    <div class="p-6">
                        <h2 class="text-2xl font-bold mb-4">New Workout</h2>
                        
                        ${state.workoutProgram ? `
                            <div class="mb-4">
                                <label class="block text-sm font-medium mb-2">Training Day</label>
                                <select id="workout-day" onchange="showWorkoutTemplate()" class="w-full border rounded-lg px-3 py-2">
                                    ${dayOptions}
                                </select>
                            </div>
                            <div id="workout-template" class="mb-4">
                                ${renderWorkoutTemplate(state.workoutProgram.split[0])}
                            </div>
                        ` : `
                            <div class="mb-4">
                                <label class="block text-sm font-medium mb-2">Workout Name</label>
                                <input type="text" id="workout-day" placeholder="e.g., Upper Body, Legs"
                                    class="w-full border rounded-lg px-3 py-2">
                            </div>
                        `}

                        <div class="flex gap-3">
                            <button onclick="confirmStartWorkout()" class="flex-1 bg-green-600 text-white py-2 px-4 rounded-lg font-medium hover:bg-green-700">
                                Start Workout
                            </button>
                            <button onclick="closeOverlay()" class="flex-1 bg-gray-200 text-gray-700 py-2 px-4 rounded-lg font-medium hover:bg-gray-300">
                                Cancel
                            </button>
                        </div>
                    </div>
                </div>
            `;
            document.body.appendChild(overlay);
        }

        function showWorkoutTemplate() {
            const day = document.getElementById('workout-day').value;
            const template = renderWorkoutTemplate(day);
            document.getElementById('workout-template').innerHTML = template;
        }

        function renderWorkoutTemplate(day) {
            if (!state.workoutProgram?.programDetails?.[day]) {
                return '';
            }

            const details = state.workoutProgram.programDetails[day];
            
            return `
                <div class="bg-blue-50 border border-blue-200 rounded-lg p-4 max-h-96 overflow-y-auto">
                    <h3 class="font-bold text-blue-900 mb-3">📋 Today's Workout Plan</h3>
                    
                    ${details.mobility ? `
                        <div class="mb-4">
                            <h4 class="font-semibold text-sm text-blue-800 mb-2">🧘 Mobility Prep (5-10 min)</h4>
                            <div class="space-y-1 text-sm">
                                ${details.mobility.map(m => `<div class="text-gray-700">• ${m}</div>`).join('')}
                            </div>
                        </div>
                    ` : ''}
                    
                    <div>
                        <h4 class="font-semibold text-sm text-blue-800 mb-2">💪 Workout</h4>
                        <div class="space-y-2 text-sm">
                            ${details.exercises.map((ex, i) => `
                                <div class="bg-white rounded p-2">
                                    <div class="font-medium text-gray-900">${i + 1}. ${ex.name}</div>
                                    <div class="text-gray-600">${ex.sets} • Rest: ${ex.rest}</div>
                                    ${ex.notes ? `<div class="text-blue-600 text-xs italic">${ex.notes}</div>` : ''}
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function confirmStartWorkout() {
            const day = document.getElementById('workout-day').value;
            if (!day) {
                alert('Please select or enter a workout name');
                return;
            }

            // Get the program template for this day if it exists
            const programTemplate = state.workoutProgram?.programDetails?.[day];
            const exercises = [];

            if (programTemplate?.exercises) {
                // Pre-populate exercises from the template
                programTemplate.exercises.forEach(templateEx => {
                    // Parse the sets (e.g., "4x8-10" -> 4 sets)
                    const setsMatch = templateEx.sets.match(/^(\d+)/);
                    const numSets = setsMatch ? parseInt(setsMatch[1]) : 3;
                    
                    exercises.push({
                        name: templateEx.name,
                        sets: Array(numSets).fill(null).map(() => ({ weight: '', reps: '' })),
                        templateNotes: templateEx.notes || ''
                    });
                });
            }

            state.currentWorkout = {
                day,
                date: new Date().toISOString(),
                exercises: exercises,
                week: getCurrentWeek()
            };

            closeOverlay();
            render();
        }

        function renderActiveWorkout() {
            const { day, exercises } = state.currentWorkout;
            
            return `
                <div class="p-4">
                    <div class="bg-gradient-to-r from-green-500 to-blue-500 text-white rounded-lg shadow-lg p-6 mb-4">
                        <h2 class="text-2xl font-bold">${day}</h2>
                        <p class="text-green-100 mt-1">Week ${state.currentWorkout.week} • ${new Date().toLocaleDateString()}</p>
                    </div>

                    ${state.activeTimer ? renderRestTimer() : ''}

                    <div class="space-y-4 mb-4">
                        ${exercises.map((ex, i) => renderExercise(ex, i)).join('')}
                    </div>

                    <button onclick="addExercise()" class="w-full bg-blue-600 text-white py-3 px-4 rounded-lg font-medium hover:bg-blue-700 mb-3">
                        + Add Exercise
                    </button>

                    <button onclick="finishWorkout()" class="w-full bg-green-600 text-white py-3 px-4 rounded-lg font-medium hover:bg-green-700">
                        Finish Workout
                    </button>

                    <button onclick="cancelWorkout()" class="w-full bg-gray-200 text-gray-700 py-2 px-4 rounded-lg font-medium hover:bg-gray-300 mt-2">
                        Cancel
                    </button>
                </div>
            `;
        }

        function renderRestTimer() {
            const { remaining, total } = state.activeTimer;
            const progress = ((total - remaining) / total) * 283; // circumference
            const minutes = Math.floor(remaining / 60);
            const seconds = remaining % 60;

            return `
                <div class="bg-white rounded-lg shadow-lg p-6 mb-4 rest-timer-active">
                    <div class="flex items-center justify-between mb-4">
                        <h3 class="text-lg font-bold">Rest Timer</h3>
                        <button onclick="stopTimer()" class="text-red-600 hover:bg-red-50 px-3 py-1 rounded">
                            Stop
                        </button>
                    </div>
                    <div class="flex items-center justify-center">
                        <svg width="120" height="120" class="transform -rotate-90">
                            <circle cx="60" cy="60" r="45" stroke="#e5e7eb" stroke-width="8" fill="none"/>
                            <circle cx="60" cy="60" r="45" stroke="#3b82f6" stroke-width="8" fill="none"
                                stroke-dasharray="283" stroke-dashoffset="${283 - progress}"
                                class="transition-all duration-1000"/>
                        </svg>
                        <div class="absolute text-3xl font-bold">
                            ${minutes}:${seconds.toString().padStart(2, '0')}
                        </div>
                    </div>
                </div>
            `;
        }

        function renderExercise(exercise, index) {
            // Find last week's notes for this exercise
            const lastWeekNotes = findLastWeekNotes(exercise.name, state.currentWorkout.day);
            
            // Find last week's performance for this exercise
            const lastWeekPerformance = findLastWeekPerformance(exercise.name, state.currentWorkout.day);
            
            return `
                <div class="bg-white rounded-lg shadow p-4">
                    <div class="flex justify-between items-start mb-2">
                        <h3 class="text-lg font-bold">${exercise.name}</h3>
                        <div class="flex gap-2">
                            <button onclick="editExerciseName(${index})" class="text-blue-600 hover:bg-blue-50 px-2 py-1 rounded text-sm">
                                Edit
                            </button>
                            <button onclick="removeExercise(${index})" class="text-red-600 hover:bg-red-50 px-2 py-1 rounded text-sm">
                                Remove
                            </button>
                        </div>
                    </div>
                    
                    ${exercise.templateNotes ? `
                        <div class="text-xs text-blue-600 italic mb-2 bg-blue-50 p-2 rounded">
                            💡 ${exercise.templateNotes}
                        </div>
                    ` : ''}

                    ${lastWeekPerformance ? `
                        <div class="text-xs bg-gray-100 p-2 rounded mb-2">
                            <span class="font-medium text-gray-700">Last week:</span>
                            <span class="text-gray-600">${lastWeekPerformance}</span>
                        </div>
                    ` : ''}

                    ${lastWeekNotes ? `
                        <div class="text-xs text-purple-600 bg-purple-50 p-2 rounded mb-3">
                            📝 ${lastWeekNotes}
                        </div>
                    ` : ''}
                    
                    <div class="space-y-2 mb-3">
                        ${exercise.sets.map((set, setIndex) => `
                            <div class="flex items-center gap-2 bg-gray-50 p-2 rounded">
                                <span class="text-sm font-medium w-12">Set ${setIndex + 1}</span>
                                <input type="number" value="${set.weight || ''}" 
                                    onchange="updateSet(${index}, ${setIndex}, 'weight', this.value)"
                                    placeholder="lbs" class="w-20 border rounded px-2 py-1 text-sm">
                                <span class="text-xs text-gray-500">lbs ×</span>
                                <input type="number" value="${set.reps || ''}"
                                    onchange="updateSet(${index}, ${setIndex}, 'reps', this.value)"
                                    placeholder="reps" class="w-16 border rounded px-2 py-1 text-sm">
                                <span class="text-xs text-gray-500">reps</span>
                                <button onclick="startRestTimer(${index}, ${setIndex})" 
                                    class="ml-auto bg-blue-100 text-blue-600 px-3 py-1 rounded text-sm font-medium hover:bg-blue-200">
                                    Rest
                                </button>
                            </div>
                        `).join('')}
                    </div>

                    <button onclick="addSet(${index})" class="text-blue-600 text-sm font-medium mb-3">
                        + Add Set
                    </button>

                    <!-- Notes field -->
                    <div class="mt-3 pt-3 border-t">
                        <label class="text-xs text-gray-600 font-medium">Notes for this exercise:</label>
                        <textarea 
                            onchange="updateExerciseNotes(${index}, this.value)"
                            placeholder="e.g., Used trap bar today, back felt great..."
                            class="w-full border rounded px-2 py-1 text-sm mt-1 resize-none"
                            rows="2">${exercise.notes || ''}</textarea>
                    </div>
                </div>
            `;
        }

        function findLastWeekPerformance(exerciseName, workoutDay) {
            // Find the most recent workout with this exercise (excluding current session)
            const pastWorkouts = state.workouts
                .filter(w => w.day === workoutDay)
                .sort((a, b) => new Date(b.date) - new Date(a.date));
            
            for (let workout of pastWorkouts) {
                const exercise = workout.exercises.find(ex => ex.name === exerciseName);
                if (exercise && exercise.sets && exercise.sets.length > 0) {
                    // Format: "135 lbs × 10, 10, 8, 8"
                    const setsDisplay = exercise.sets
                        .filter(s => s.weight && s.reps)
                        .map(s => `${s.weight} lbs × ${s.reps}`)
                        .join(', ');
                    
                    if (setsDisplay) {
                        return setsDisplay;
                    }
                }
            }
            return null;
        }

        function findLastWeekNotes(exerciseName, workoutDay) {
            // Find the most recent workout with this exercise (excluding current session)
            const pastWorkouts = state.workouts
                .filter(w => w.day === workoutDay)
                .sort((a, b) => new Date(b.date) - new Date(a.date));
            
            for (let workout of pastWorkouts) {
                const exercise = workout.exercises.find(ex => ex.name === exerciseName);
                if (exercise && exercise.notes) {
                    return exercise.notes;
                }
            }
            return null;
        }

        function updateExerciseNotes(index, notes) {
            state.currentWorkout.exercises[index].notes = notes;
        }

        function editExerciseName(index) {
            const exercise = state.currentWorkout.exercises[index];
            const newName = prompt('Edit exercise name:', exercise.name);
            
            if (newName && newName.trim()) {
                const oldName = exercise.name;
                exercise.name = newName.trim();
                
                // Update in the program template so this change persists
                const day = state.currentWorkout.day;
                if (state.workoutProgram?.programDetails?.[day]?.exercises) {
                    const templateEx = state.workoutProgram.programDetails[day].exercises.find(ex => ex.name === oldName);
                    if (templateEx) {
                        templateEx.name = newName.trim();
                        saveProgram();
                    }
                }
                
                render();
            }
        }

        function addExercise() {
            const name = prompt('Exercise name:');
            if (!name) return;

            state.currentWorkout.exercises.push({
                name,
                sets: [{ weight: '', reps: '' }]
            });
            render();
        }

        function removeExercise(index) {
            if (confirm('Remove this exercise?')) {
                state.currentWorkout.exercises.splice(index, 1);
                render();
            }
        }

        function addSet(exerciseIndex) {
            state.currentWorkout.exercises[exerciseIndex].sets.push({ weight: '', reps: '' });
            render();
        }

        function updateSet(exerciseIndex, setIndex, field, value) {
            state.currentWorkout.exercises[exerciseIndex].sets[setIndex][field] = value;
        }

        function startRestTimer(exerciseIndex, setIndex) {
            // Show preset timer options
            const overlay = document.createElement('div');
            overlay.className = 'fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4';
            overlay.innerHTML = `
                <div class="bg-white rounded-lg max-w-md w-full p-6">
                    <h3 class="text-xl font-bold mb-4">Rest Timer</h3>
                    
                    <div class="grid grid-cols-2 gap-3 mb-4">
                        <button onclick="startTimerWithDuration(60); closeOverlay();" 
                            class="bg-blue-500 text-white py-4 rounded-lg text-lg font-bold hover:bg-blue-600">
                            60s
                        </button>
                        <button onclick="startTimerWithDuration(90); closeOverlay();" 
                            class="bg-blue-500 text-white py-4 rounded-lg text-lg font-bold hover:bg-blue-600">
                            90s
                        </button>
                        <button onclick="startTimerWithDuration(120); closeOverlay();" 
                            class="bg-blue-500 text-white py-4 rounded-lg text-lg font-bold hover:bg-blue-600">
                            2m
                        </button>
                        <button onclick="startTimerWithDuration(180); closeOverlay();" 
                            class="bg-blue-500 text-white py-4 rounded-lg text-lg font-bold hover:bg-blue-600">
                            3m
                        </button>
                    </div>
                    
                    <div class="border-t pt-4">
                        <label class="block text-sm font-medium mb-2">Custom (seconds):</label>
                        <input type="number" id="custom-timer" placeholder="e.g., 45" 
                            class="w-full border rounded-lg px-3 py-2 mb-3">
                        <button onclick="startCustomTimer(); closeOverlay();" 
                            class="w-full bg-gray-600 text-white py-2 rounded-lg font-medium hover:bg-gray-700">
                            Start Custom Timer
                        </button>
                    </div>
                    
                    <button onclick="closeOverlay()" 
                        class="w-full bg-gray-200 text-gray-700 py-2 px-4 rounded-lg font-medium hover:bg-gray-300 mt-3">
                        Cancel
                    </button>
                </div>
            `;
            document.body.appendChild(overlay);
        }

        function startTimerWithDuration(seconds) {
            state.activeTimer = {
                remaining: seconds,
                total: seconds,
                interval: null
            };

            state.activeTimer.interval = setInterval(() => {
                state.activeTimer.remaining--;
                
                if (state.activeTimer.remaining <= 0) {
                    stopTimer();
                    // Play a sound or vibration would go here
                    alert('Rest complete!');
                }
                render();
            }, 1000);

            render();
        }

        function startCustomTimer() {
            const input = document.getElementById('custom-timer');
            const seconds = parseInt(input?.value);
            if (!seconds || seconds <= 0) {
                alert('Please enter a valid number of seconds');
                return;
            }
            startTimerWithDuration(seconds);
        }

        function stopTimer() {
            if (state.activeTimer?.interval) {
                clearInterval(state.activeTimer.interval);
            }
            state.activeTimer = null;
            render();
        }

        async function finishWorkout() {
            if (state.currentWorkout.exercises.length === 0) {
                alert('Add at least one exercise before finishing');
                return;
            }

            state.workouts.push(state.currentWorkout);
            await saveWorkouts();
            
            state.currentWorkout = null;
            stopTimer();
            render();
        }

        function cancelWorkout() {
            if (confirm('Cancel this workout? All progress will be lost.')) {
                state.currentWorkout = null;
                stopTimer();
                render();
            }
        }

        function renderRecentWorkouts() {
            const recent = state.workouts.slice(-5).reverse();
            
            if (recent.length === 0) {
                return `
                    <div class="bg-white rounded-lg shadow p-6 text-center text-gray-500">
                        <p>No workouts logged yet</p>
                        <p class="text-sm mt-2">Start your first workout to begin tracking progress</p>
                    </div>
                `;
            }

            return `
                <div class="bg-white rounded-lg shadow">
                    <div class="p-4 border-b">
                        <h3 class="font-bold">Recent Workouts</h3>
                    </div>
                    <div class="divide-y">
                        ${recent.map(workout => `
                            <div class="p-4">
                                <div class="flex justify-between items-start mb-2">
                                    <div>
                                        <h4 class="font-bold">${workout.day}</h4>
                                        <p class="text-sm text-gray-500">${new Date(workout.date).toLocaleDateString()} • Week ${workout.week}</p>
                                    </div>
                                    <span class="text-sm text-gray-500">${workout.exercises.length} exercises</span>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderDashboardView() {
            const totalWorkouts = state.workouts.length;
            const thisWeekDates = getWeekDates();
            const thisWeekWorkouts = state.workouts.filter(w => thisWeekDates.includes(new Date(w.date).toDateString())).length;
            
            // Calculate workout streak (consecutive weeks with 4+ workouts)
            const weekStreak = calculateWeekStreak();
            
            // Calculate PRs
            const prs = calculatePRs();
            
            // Calculate habit completion stats
            const dailyHabits = state.habits.filter(h => h.frequency === 'Daily');
            const weeklyHabits = state.habits.filter(h => h.frequency === 'Weekly');
            
            const dailyCompletionToday = dailyHabits.filter(h => 
                h.completions?.includes(new Date().toDateString())
            ).length;
            
            let weeklyGoalsMet = 0;
            weeklyHabits.forEach(habit => {
                const weekCompletions = thisWeekDates.filter(date => 
                    habit.completions?.includes(date)
                ).length;
                if (weekCompletions >= habit.target) weeklyGoalsMet++;
            });

            // Get last 4 weeks of habit data for trend
            const last4Weeks = [];
            for (let i = 3; i >= 0; i--) {
                const weekStart = new Date();
                weekStart.setDate(weekStart.getDate() - (weekStart.getDay()) - (i * 7));
                const weekDates = [];
                for (let j = 0; j < 7; j++) {
                    const date = new Date(weekStart);
                    date.setDate(date.getDate() + j);
                    weekDates.push(date.toDateString());
                }
                
                let totalCompletions = 0;
                state.habits.forEach(habit => {
                    totalCompletions += weekDates.filter(date => habit.completions?.includes(date)).length;
                });
                
                last4Weeks.push({
                    label: i === 0 ? 'This Week' : `${i}w ago`,
                    completions: totalCompletions
                });
            }

            const maxCompletions = Math.max(...last4Weeks.map(w => w.completions), 1);

            return `
                <div class="p-4">
                    <h2 class="text-2xl font-bold mb-4">Dashboard</h2>

                    <!-- Quick Stats Grid -->
                    <div class="grid grid-cols-2 gap-3 mb-6">
                        <div class="bg-gradient-to-br from-blue-500 to-blue-600 text-white rounded-lg p-4 shadow">
                            <div class="text-3xl font-bold">${thisWeekWorkouts}</div>
                            <div class="text-sm text-blue-100">Workouts This Week</div>
                        </div>
                        <div class="bg-gradient-to-br from-green-500 to-green-600 text-white rounded-lg p-4 shadow">
                            <div class="text-3xl font-bold">${dailyCompletionToday}/${dailyHabits.length}</div>
                            <div class="text-sm text-green-100">Daily Habits Today</div>
                        </div>
                        <div class="bg-gradient-to-br from-purple-500 to-purple-600 text-white rounded-lg p-4 shadow">
                            <div class="text-3xl font-bold">${weekStreak}</div>
                            <div class="text-sm text-purple-100">Week Streak 🔥</div>
                        </div>
                        <div class="bg-gradient-to-br from-orange-500 to-orange-600 text-white rounded-lg p-4 shadow">
                            <div class="text-3xl font-bold">${weeklyGoalsMet}/${weeklyHabits.length}</div>
                            <div class="text-sm text-orange-100">Weekly Goals Met</div>
                        </div>
                    </div>

                    <!-- Personal Records -->
                    ${prs.length > 0 ? `
                        <div class="bg-gradient-to-br from-yellow-400 to-yellow-500 text-gray-900 rounded-lg shadow p-6 mb-4">
                            <h3 class="font-bold text-lg mb-3 flex items-center gap-2">
                                🏆 Personal Records
                            </h3>
                            <div class="space-y-2 max-h-48 overflow-y-auto">
                                ${prs.slice(0, 5).map(pr => `
                                    <div class="bg-white/50 rounded p-2 flex justify-between items-center">
                                        <div>
                                            <div class="font-semibold text-sm">${pr.exercise}</div>
                                            <div class="text-xs text-gray-700">${new Date(pr.date).toLocaleDateString()}</div>
                                        </div>
                                        <div class="text-right">
                                            <div class="font-bold text-lg">${pr.weight} lbs</div>
                                            <div class="text-xs">${pr.reps} reps</div>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    ` : ''}

                    <!-- Habit Trend -->
                    <div class="bg-white rounded-lg shadow p-6 mb-4">
                        <h3 class="font-bold text-lg mb-4">Habit Completion Trend</h3>
                        <div class="flex items-end justify-between gap-2 h-32">
                            ${last4Weeks.map(week => {
                                const height = (week.completions / maxCompletions) * 100;
                                return `
                                    <div class="flex-1 flex flex-col items-center">
                                        <div class="w-full bg-blue-500 rounded-t transition-all" style="height: ${height}%"></div>
                                        <div class="text-xs text-gray-600 mt-2">${week.label}</div>
                                        <div class="text-sm font-bold text-gray-800">${week.completions}</div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>

                    <!-- Current Week Habit Calendar -->
                    <div class="bg-white rounded-lg shadow p-6 mb-4">
                        <h3 class="font-bold text-lg mb-4">This Week's Habits</h3>
                        ${renderWeeklyHabitGrid()}
                    </div>

                    <!-- Exercise Progress -->
                    ${renderExerciseProgress()}
                </div>
            `;
        }

        function calculateWeekStreak() {
            if (state.workouts.length === 0) return 0;
            
            let streak = 0;
            let currentDate = new Date();
            
            // Start from last Monday
            currentDate.setDate(currentDate.getDate() - currentDate.getDay() + 1);
            currentDate.setHours(0, 0, 0, 0);
            
            while (true) {
                const weekStart = new Date(currentDate);
                const weekEnd = new Date(currentDate);
                weekEnd.setDate(weekEnd.getDate() + 6);
                weekEnd.setHours(23, 59, 59, 999);
                
                // Count workouts in this week
                const workoutsThisWeek = state.workouts.filter(w => {
                    const workoutDate = new Date(w.date);
                    return workoutDate >= weekStart && workoutDate <= weekEnd;
                }).length;
                
                // Need at least 4 workouts to continue streak
                if (workoutsThisWeek >= 4) {
                    streak++;
                    currentDate.setDate(currentDate.getDate() - 7); // Go back one week
                } else {
                    break;
                }
                
                // Safety: don't go back more than 52 weeks
                if (streak > 52) break;
            }
            
            return streak;
        }

        function calculatePRs() {
            const prs = [];
            const exerciseMaxes = {};
            
            // Sort workouts by date (oldest first)
            const sortedWorkouts = [...state.workouts].sort((a, b) => 
                new Date(a.date) - new Date(b.date)
            );
            
            sortedWorkouts.forEach(workout => {
                workout.exercises.forEach(exercise => {
                    exercise.sets.forEach(set => {
                        const weight = parseFloat(set.weight);
                        const reps = parseFloat(set.reps);
                        
                        if (weight && reps) {
                            if (!exerciseMaxes[exercise.name]) {
                                // First time seeing this exercise
                                exerciseMaxes[exercise.name] = { weight, reps, date: workout.date };
                                prs.push({
                                    exercise: exercise.name,
                                    weight,
                                    reps,
                                    date: workout.date
                                });
                            } else if (weight > exerciseMaxes[exercise.name].weight) {
                                // New PR!
                                exerciseMaxes[exercise.name] = { weight, reps, date: workout.date };
                                prs.push({
                                    exercise: exercise.name,
                                    weight,
                                    reps,
                                    date: workout.date
                                });
                            }
                        }
                    });
                });
            });
            
            // Return most recent PRs first
            return prs.reverse();
        }

        function renderWeeklyHabitGrid() {
            const thisWeek = getWeekDates();
            const dayNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            
            return `
                <div class="overflow-x-auto">
                    <table class="w-full text-sm">
                        <thead>
                            <tr class="border-b">
                                <th class="text-left py-2 px-2">Habit</th>
                                ${dayNames.map((day, i) => {
                                    const isToday = thisWeek[i] === new Date().toDateString();
                                    return `<th class="text-center py-2 px-1 ${isToday ? 'bg-blue-50' : ''}">${day}</th>`;
                                }).join('')}
                            </tr>
                        </thead>
                        <tbody>
                            ${state.habits.map(habit => `
                                <tr class="border-b">
                                    <td class="py-2 px-2 text-xs">${habit.name.replace(/[^\w\s]/gi, '').substring(0, 20)}</td>
                                    ${thisWeek.map((date, i) => {
                                        const isChecked = habit.completions?.includes(date);
                                        const isToday = date === new Date().toDateString();
                                        return `
                                            <td class="text-center py-2 px-1 ${isToday ? 'bg-blue-50' : ''}">
                                                ${isChecked ? '<span class="text-green-600">✓</span>' : '<span class="text-gray-300">-</span>'}
                                            </td>
                                        `;
                                    }).join('')}
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        }

        function renderExerciseProgress() {
            if (state.workouts.length === 0) {
                return `
                    <div class="bg-white rounded-lg shadow p-8 text-center text-gray-500">
                        <p>Complete workouts to see exercise progress</p>
                    </div>
                `;
            }

            const byExercise = {};
            state.workouts.forEach(workout => {
                workout.exercises.forEach(exercise => {
                    if (!byExercise[exercise.name]) {
                        byExercise[exercise.name] = [];
                    }
                    byExercise[exercise.name].push({
                        date: workout.date,
                        week: workout.week,
                        sets: exercise.sets
                    });
                });
            });

            return `
                <div class="bg-white rounded-lg shadow">
                    <div class="p-4 border-b">
                        <h3 class="font-bold text-lg">Exercise Progress</h3>
                    </div>
                    <div class="divide-y max-h-96 overflow-y-auto">
                        ${Object.entries(byExercise).map(([name, sessions]) => {
                            const latest = sessions[sessions.length - 1];
                            const maxWeight = Math.max(...latest.sets.map(s => parseFloat(s.weight) || 0));
                            const totalVolume = latest.sets.reduce((sum, s) => 
                                sum + ((parseFloat(s.weight) || 0) * (parseFloat(s.reps) || 0)), 0
                            );
                            
                            return `
                                <div class="p-4">
                                    <div class="flex justify-between items-start">
                                        <div class="flex-1">
                                            <h4 class="font-bold text-sm">${name}</h4>
                                            <p class="text-xs text-gray-500">${sessions.length} sessions</p>
                                        </div>
                                        <div class="text-right">
                                            <div class="font-bold text-blue-600">${maxWeight} lbs</div>
                                            <div class="text-xs text-gray-500">${Math.round(totalVolume)} vol</div>
                                        </div>
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;
        }

        function renderHabitsView() {
            const dailyHabits = state.habits.filter(h => h.frequency === 'Daily');
            const weeklyHabits = state.habits.filter(h => h.frequency === 'Weekly');
            
            return `
                <div class="p-4">
                    <div class="bg-white rounded-lg shadow p-6 mb-4">
                        <h2 class="text-xl font-bold mb-4">Habit Tracker</h2>
                        <button onclick="addHabit()" class="w-full bg-blue-600 text-white py-2 px-4 rounded-lg font-medium hover:bg-blue-700">
                            + Add Custom Habit
                        </button>
                    </div>

                    ${state.habits.length === 0 ? `
                        <div class="bg-white rounded-lg shadow p-8 text-center text-gray-500">
                            <div class="text-6xl mb-4">✓</div>
                            <p class="text-lg">No habits yet</p>
                            <p class="text-sm mt-2">Add habits to start tracking</p>
                        </div>
                    ` : `
                        ${dailyHabits.length > 0 ? `
                            <div class="mb-6">
                                <h3 class="text-lg font-bold text-gray-700 mb-3 px-1">Daily Habits</h3>
                                <div class="space-y-3">
                                    ${dailyHabits.map((habit, i) => {
                                        const originalIndex = state.habits.indexOf(habit);
                                        return renderHabit(habit, originalIndex);
                                    }).join('')}
                                </div>
                            </div>
                        ` : ''}
                        
                        ${weeklyHabits.length > 0 ? `
                            <div>
                                <h3 class="text-lg font-bold text-gray-700 mb-3 px-1">Weekly Goals</h3>
                                <div class="space-y-3">
                                    ${weeklyHabits.map((habit, i) => {
                                        const originalIndex = state.habits.indexOf(habit);
                                        return renderHabit(habit, originalIndex);
                                    }).join('')}
                                </div>
                            </div>
                        ` : ''}
                    `}
                </div>
            `;
        }

        function renderHabit(habit, index) {
            const today = new Date().toDateString();
            const isCheckedToday = habit.completions?.includes(today);
            const thisWeek = getWeekDates();
            const weekCompletions = thisWeek.filter(date => 
                habit.completions?.includes(date)
            ).length;
            
            const isWeekly = habit.frequency === 'Weekly';
            const progress = isWeekly ? weekCompletions : (isCheckedToday ? 1 : 0);
            const target = isWeekly ? habit.target : 1;
            const isComplete = progress >= target;

            // Get day names for calendar
            const dayNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

            return `
                <div class="bg-white rounded-lg shadow p-4">
                    <div class="flex justify-between items-start mb-3">
                        <div class="flex-1">
                            <h3 class="text-lg font-bold">${habit.name}</h3>
                            <p class="text-sm ${isWeekly ? 'text-blue-600 font-medium' : 'text-gray-500'}">
                                ${isWeekly ? `Weekly Goal: ${habit.target}x` : 'Daily'}
                            </p>
                        </div>
                        <button onclick="removeHabit(${index})" class="text-red-600 hover:bg-red-50 px-2 py-1 rounded text-sm">
                            Remove
                        </button>
                    </div>

                    ${isWeekly ? `
                        <div class="bg-gray-50 rounded-lg p-3 mb-3">
                            <div class="flex items-center justify-between mb-2">
                                <span class="text-sm text-gray-600">This Week</span>
                                <span class="text-lg font-bold ${isComplete ? 'text-green-600' : 'text-blue-600'}">
                                    ${weekCompletions}/${habit.target}
                                </span>
                            </div>
                            <div class="flex-1 bg-gray-200 rounded-full h-3">
                                <div class="h-3 rounded-full transition-all ${isComplete ? 'bg-green-500' : 'bg-blue-500'}" 
                                    style="width: ${Math.min((weekCompletions / habit.target) * 100, 100)}%"></div>
                            </div>
                        </div>
                    ` : ''}

                    <!-- Weekly Calendar View -->
                    <div class="mb-3">
                        <div class="grid grid-cols-7 gap-1">
                            ${thisWeek.map((date, dayIndex) => {
                                const dateObj = new Date(date);
                                const isToday = date === today;
                                const isChecked = habit.completions?.includes(date);
                                const isPast = dateObj < new Date(new Date().setHours(0,0,0,0));
                                const isFuture = dateObj > new Date(new Date().setHours(0,0,0,0));
                                
                                return `
                                    <div class="text-center">
                                        <div class="text-xs text-gray-500 mb-1">${dayNames[dayIndex]}</div>
                                        <button 
                                            onclick="toggleHabitDate(${index}, '${date}')"
                                            ${isFuture ? 'disabled' : ''}
                                            class="w-full aspect-square rounded-lg text-sm font-medium transition-all ${
                                                isChecked 
                                                    ? 'bg-green-500 text-white' 
                                                    : isToday 
                                                        ? 'bg-blue-100 border-2 border-blue-500 text-blue-700 hover:bg-blue-200' 
                                                        : isPast
                                                            ? 'bg-gray-100 text-gray-400 hover:bg-gray-200'
                                                            : 'bg-gray-50 text-gray-300 cursor-not-allowed'
                                            }">
                                            ${isChecked ? '✓' : dateObj.getDate()}
                                        </button>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>

                    <div class="flex items-center justify-between text-xs text-gray-500">
                        <span>${habit.completions?.length || 0} total completions</span>
                        ${isWeekly && isComplete ? '<span class="text-green-600 font-medium">✓ Weekly goal met!</span>' : ''}
                    </div>
                </div>
            `;
        }

        function getWeekDates() {
            const now = new Date();
            const week = [];
            const day = now.getDay();
            const diff = now.getDate() - day;
            
            for (let i = 0; i < 7; i++) {
                const date = new Date(now);
                date.setDate(diff + i);
                week.push(date.toDateString());
            }
            return week;
        }

        function addHabit() {
            const overlay = document.createElement('div');
            overlay.className = 'fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4';
            overlay.innerHTML = `
                <div class="bg-white rounded-lg max-w-md w-full">
                    <div class="p-6">
                        <h2 class="text-2xl font-bold mb-4">New Habit</h2>
                        
                        <div class="mb-4">
                            <label class="block text-sm font-medium mb-2">Habit Name</label>
                            <input type="text" id="habit-name" placeholder="e.g., Drink 8 glasses of water"
                                class="w-full border rounded-lg px-3 py-2">
                        </div>

                        <div class="mb-4">
                            <label class="block text-sm font-medium mb-2">Frequency</label>
                            <select id="habit-frequency" onchange="toggleTarget()" class="w-full border rounded-lg px-3 py-2">
                                <option value="Daily">Daily</option>
                                <option value="Weekly">Weekly</option>
                            </select>
                        </div>

                        <div id="target-container" class="mb-4 hidden">
                            <label class="block text-sm font-medium mb-2">Weekly Target</label>
                            <input type="number" id="habit-target" value="5" min="1" max="7"
                                class="w-full border rounded-lg px-3 py-2">
                        </div>

                        <div class="flex gap-3">
                            <button onclick="saveHabit()" class="flex-1 bg-blue-600 text-white py-2 px-4 rounded-lg font-medium hover:bg-blue-700">
                                Add Habit
                            </button>
                            <button onclick="closeOverlay()" class="flex-1 bg-gray-200 text-gray-700 py-2 px-4 rounded-lg font-medium hover:bg-gray-300">
                                Cancel
                            </button>
                        </div>
                    </div>
                </div>
            `;
            document.body.appendChild(overlay);
        }

        function toggleTarget() {
            const frequency = document.getElementById('habit-frequency').value;
            const targetContainer = document.getElementById('target-container');
            targetContainer.classList.toggle('hidden', frequency === 'Daily');
        }

        async function saveHabit() {
            const name = document.getElementById('habit-name').value;
            const frequency = document.getElementById('habit-frequency').value;
            const target = frequency === 'Weekly' ? parseInt(document.getElementById('habit-target').value) : 1;

            if (!name) {
                alert('Please enter a habit name');
                return;
            }

            state.habits.push({
                name,
                frequency,
                target,
                completions: []
            });

            await saveHabits();
            closeOverlay();
            render();
        }

        async function removeHabit(index) {
            if (confirm('Remove this habit?')) {
                state.habits.splice(index, 1);
                await saveHabits();
                render();
            }
        }

        async function toggleHabit(index) {
            const today = new Date().toDateString();
            const habit = state.habits[index];
            
            if (!habit.completions) {
                habit.completions = [];
            }

            const idx = habit.completions.indexOf(today);
            if (idx > -1) {
                habit.completions.splice(idx, 1);
            } else {
                habit.completions.push(today);
            }

            await saveHabits();
            render();
        }

        async function toggleHabitDate(index, date) {
            const habit = state.habits[index];
            
            if (!habit.completions) {
                habit.completions = [];
            }

            const idx = habit.completions.indexOf(date);
            if (idx > -1) {
                habit.completions.splice(idx, 1);
            } else {
                habit.completions.push(date);
            }

            await saveHabits();
            render();
        }

        function switchView(view) {
            state.currentView = view;
            render();
        }

        // Initialize app
        init();
    </script>
</body>
</html>
