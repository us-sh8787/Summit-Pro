<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Summit Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overscroll-behavior: none;
        }
        .timer-ring {
            transform: rotate(-90deg);
            transform-origin: center;
        }
        .habit-checkbox:checked + label {
            background-color: #10b981;
            border-color: #10b981;
            color: white;
        }
        .rest-timer-active {
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            opacity: 1;
            height: 40px;
        }
    </style>
</head>
<body class="bg-gray-50">
    <div id="app" class="max-w-4xl mx-auto pb-20"></div>

    <script>
        // Storage wrapper with localStorage fallback for iOS home screen compatibility
        const storage = {
            get: async (key) => {
                try {
                    // Try window.storage first
                    const result = await window.storage.get(key);
                    return result ? JSON.parse(result.value) : null;
                } catch (error) {
                    // Fallback to localStorage for iOS home screen apps
                    console.log('Using localStorage fallback for:', key);
                    const value = localStorage.getItem(key);
                    return value ? JSON.parse(value) : null;
                }
            },
            set: async (key, value) => {
                try {
                    // Try window.storage first
                    await window.storage.set(key, JSON.stringify(value));
                    // Also save to localStorage as backup
                    localStorage.setItem(key, JSON.stringify(value));
                    return true;
                } catch (error) {
                    // Fallback to localStorage only
                    console.log('Using localStorage fallback for:', key);
                    localStorage.setItem(key, JSON.stringify(value));
                    return true;
                }
            },
            list: async (prefix) => {
                try {
                    const result = await window.storage.list(prefix);
                    return result ? result.keys : [];
                } catch (error) {
                    console.log('Storage list not available, using localStorage');
                    return [];
                }
            }
        };

        // State management
        let state = {
            currentView: 'workout',
            workouts: [],
            habits: [],
            activeTimer: null,
            currentWorkout: null,
            workoutProgram: null
        };

        // Initialize
        async function init() {
            await loadData();
            render();
        }

        async function loadData() {
            const workoutsData = await storage.get('workouts');
            const habitsData = await storage.get('habits');
            const programData = await storage.get('workout-program');
            
            state.workouts = workoutsData || [];
            
            // Initialize with default habits if none exist
            state.habits = habitsData || [
                { name: '💧 100oz Water', frequency: 'Daily', target: 1, completions: [] },
                { name: '📖 Read 10 Pages / 15 Min', frequency: 'Daily', target: 1, completions: [] },
                { name: '☀️ 20 Min Sunlight', frequency: 'Daily', target: 1, completions: [] },
                { name: '❤️ Show Wife Affection', frequency: 'Daily', target: 1, completions: [] },
                { name: '💪 Resistance Training', frequency: 'Weekly', target: 4, completions: [] },
                { name: '🏃 30 Min Zone 2 Cardio', frequency: 'Weekly', target: 3, completions: [] },
                { name: '⚡ Zone 5 Cardio', frequency: 'Weekly', target: 1, completions: [] },
                { name: '🧘 Morning Routine (Breathwork, Meditation, Prayer, Gratitude, Mindset)', frequency: 'Weekly', target: 5, completions: [] },
                { name: '🍎 Track Macros & Follow Food Rules', frequency: 'Weekly', target: 6, completions: [] }
            ];
            
            // Save default habits if this is first load
            if (!habitsData) {
                await saveHabits();
            }
            
            // Initialize with custom 4-day Upper/Lower program if none exists
            state.workoutProgram = programData || {
                name: "Upper/Lower Hypertrophy",
                duration: 6,
                split: [
                    "Lower A - Quad/Hip Dominant (Big Box - Monday)",
                    "Upper A - Horizontal Push/Pull (Tuesday)",
                    "Lower B - Posterior/Unilateral (Thursday)",
                    "Upper B - Vertical Push/Pull (Friday)"
                ],
                startDate: new Date().toISOString(),
                programDetails: {
                    "Lower A - Quad/Hip Dominant (Big Box - Monday)": {
                        mobility: [
                            "90/90 Hip Stretch: 2x60 sec each side",
                            "Spiderman Lunge w/ Rotation: 2x6 each side",
                            "Dead Bugs: 2x10 each side",
                            "Couch Stretch: 2x45 sec each side"
                        ],
                        exercises: [
                            { name: "Leg Press", sets: "4x10-12", rest: "2-3 min", notes: "Tempo: 3010, control the descent" },
                            { name: "Smith Machine Bulgarian Split Squat", sets: "4x8-10/leg", rest: "2 min", notes: "Back foot elevated, front shin vertical" },
                            { name: "Smith Machine RDL", sets: "3x12-15", rest: "90 sec", notes: "Tempo: 3110, feel the stretch" },
                            { name: "Superset A1: Leg Extension", sets: "2x15-20", rest: "60 sec", notes: "Last set: drop set to failure" },
                            { name: "Superset A2: Lying Leg Curl", sets: "2x15-20", rest: "60 sec", notes: "Last set: drop set to failure" },
                            { name: "Superset B1: Standing Calf Raise", sets: "3x12-15", rest: "45 sec", notes: "2 sec hold at top" },
                            { name: "Superset B2: Seated Calf Raise", sets: "3x15-20", rest: "45 sec", notes: "Burn out" }
                        ]
                    },
                    "Upper A - Horizontal Push/Pull (Tuesday)": {
                        mobility: [
                            "Band Pull-Aparts: 2x20",
                            "Wall Slides: 2x10",
                            "Thoracic Rotations (Quadruped): 2x8 each side",
                            "Cat-Cow: 2x10"
                        ],
                        exercises: [
                            { name: "DB Bench Press", sets: "4x8-10", rest: "2-3 min", notes: "Tempo: 3010 (3 sec down, 1 sec up)" },
                            { name: "Chest Supported Row (or Seal Row)", sets: "4x10-12", rest: "2 min", notes: "Squeeze at top for 1 sec" },
                            { name: "Superset A1: Incline DB Press", sets: "3x12-15", rest: "90 sec", notes: "Moderate tempo" },
                            { name: "Superset A2: Single Arm DB Row", sets: "3x12-15/arm", rest: "90 sec", notes: "Control the eccentric" },
                            { name: "Superset B1: DB Lateral Raise", sets: "2x15-20", rest: "60 sec", notes: "Light weight, strict form" },
                            { name: "Superset B2: Face Pulls (Band)", sets: "2x20-25", rest: "60 sec", notes: "High reps, burn out" },
                            { name: "Superset C1: Overhead Tricep Extension (DB/KB)", sets: "2x12-15", rest: "60 sec", notes: "To fatigue" },
                            { name: "Superset C2: DB Hammer Curls", sets: "2x12-15", rest: "60 sec", notes: "To fatigue" }
                        ]
                    },
                    "Lower B - Posterior/Unilateral (Thursday)": {
                        mobility: [
                            "90/90 Hip Stretch: 2x60 sec each side",
                            "World's Greatest Stretch: 2x5 each side",
                            "Glute Bridges (Activation): 2x15 w/ 2 sec hold",
                            "Psoas March: 2x10 each leg"
                        ],
                        exercises: [
                            { name: "DB or KB Romanian Deadlift", sets: "4x10-12", rest: "2 min", notes: "Tempo: 3110, hamstring stretch" },
                            { name: "DB Walking Lunges (or Reverse Lunges)", sets: "4x10/leg", rest: "2 min", notes: "DBs at side, upright torso" },
                            { name: "Single Leg RDL (DB)", sets: "3x10/leg", rest: "90 sec", notes: "Balance & symmetry focus" },
                            { name: "Superset A1: DB Step-Ups", sets: "3x12/leg", rest: "60 sec", notes: "Controlled tempo, drive through heel" },
                            { name: "Superset A2: Nordic Hamstring Curl (Eccentric focus)", sets: "3x6-8", rest: "60 sec", notes: "Slow eccentric, assisted concentric OK" },
                            { name: "Superset B1: 45-Degree Back Extension or Reverse Hyper", sets: "2x15-20", rest: "45 sec", notes: "Hold KB/plate, squeeze glutes" },
                            { name: "Superset B2: Dead Bugs or Pallof Press", sets: "2x12 each side", rest: "45 sec", notes: "Core stability, anti-rotation" }
                        ]
                    },
                    "Upper B - Vertical Push/Pull (Friday)": {
                        mobility: [
                            "Band Pull-Aparts: 2x20",
                            "Overhead Reach w/ Lat Stretch: 2x8 each side",
                            "Thoracic Extension (Foam Roller): 2x60 sec",
                            "Scapular Wall Slides: 2x12"
                        ],
                        exercises: [
                            { name: "DB Overhead Press (Seated or Standing)", sets: "4x8-10", rest: "2-3 min", notes: "Strict form, control down" },
                            { name: "Pull-Ups or Lat Pulldown", sets: "4x8-12", rest: "2 min", notes: "Full ROM, squeeze at bottom" },
                            { name: "Superset A1: DB Arnold Press", sets: "3x10-12", rest: "90 sec", notes: "Tempo: 3010" },
                            { name: "Superset A2: Chest Supported Reverse Fly", sets: "3x15", rest: "90 sec", notes: "Light, squeeze rear delts" },
                            { name: "Superset B1: Cable or Band Rope Tricep Pushdown", sets: "2x15-20", rest: "60 sec", notes: "To fatigue, last set drop set" },
                            { name: "Superset B2: Incline DB Curl", sets: "2x12-15", rest: "60 sec", notes: "Full stretch at bottom" },
                            { name: "Superset C1: Barbell or DB Shrugs", sets: "2x20", rest: "45 sec", notes: "Hold at top for 2 sec" },
                            { name: "Superset C2: DB Front Raise", sets: "2x15", rest: "45 sec", notes: "Burn out" }
                        ]
                    }
                }
            };
            
            // Save default program if this is first load
            if (!programData) {
                await saveProgram();
            }
        }

        async function saveWorkouts() {
            await storage.set('workouts', state.workouts);
        }

        async function saveHabits() {
            await storage.set('habits', state.habits);
        }

        async function saveProgram() {
            await storage.set('workout-program', state.workoutProgram);
        }

        // Render functions
        function render() {
            const app = document.getElementById('app');
            app.innerHTML = `
                ${renderHeader()}
                ${renderNavigation()}
                ${renderContent()}
            `;
        }

        function renderHeader() {
            return `
                <div class="bg-gradient-to-r from-blue-600 to-purple-600 text-white p-6 shadow-lg">
                    <h1 class="text-3xl font-bold">Summit Pro</h1>
                    <p class="text-blue-100 mt-1">Track workouts & build habits</p>
                </div>
            `;
        }

        function renderNavigation() {
            const tabs = [
                { id: 'workout', label: 'Workout', icon: '💪' },
                { id: 'dashboard', label: 'Dashboard', icon: '📊' },
                { id: 'habits', label: 'Habits', icon: '✓' }
            ];

            return `
                <div class="bg-white border-b sticky top-0 z-10 shadow-sm">
                    <div class="flex">
                        ${tabs.map(tab => `
                            <button 
                                onclick="switchView('${tab.id}')"
                                class="flex-1 py-4 px-4 text-center font-medium transition-colors ${
                                    state.currentView === tab.id 
                                        ? 'text-blue-600 border-b-2 border-blue-600 bg-blue-50' 
                                        : 'text-gray-600 hover:bg-gray-50'
                                }">
                                <span class="text-xl">${tab.icon}</span>
                                <div class="text-sm mt-1">${tab.label}</div>
                            </button>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderContent() {
            switch(state.currentView) {
                case 'workout':
                    return renderWorkoutView();
                case 'dashboard':
                    return renderDashboardView();
                case 'habits':
                    return renderHabitsView();
                default:
                    return '';
            }
        }

        function renderWorkoutView() {
            if (state.currentWorkout) {
                return renderActiveWorkout();
            }

            const currentWeek = getCurrentWeek();
            const thisWeekDates = getWeekDates();
            
            // Check which workouts have been completed this week
            const completedThisWeek = {};
            state.workouts.forEach(workout => {
                const workoutDate = new Date(workout.date).toDateString();
                if (thisWeekDates.includes(workoutDate)) {
                    completedThisWeek[workout.day] = true;
                }
            });

            return `
                <div class="p-4">
                    ${state.workoutProgram ? `
                        <!-- Program Header -->
                        <div class="bg-gradient-to-r from-purple-500 to-blue-500 text-white rounded-lg shadow-lg p-6 mb-6">
                            <h2 class="text-2xl font-bold mb-2">${state.workoutProgram.name}</h2>
                            <div class="flex items-center justify-between">
                                <div>
                                    <p class="text-purple-100">Week ${currentWeek} of ${state.workoutProgram.duration}</p>
                                    <p class="text-sm text-purple-200 mt-1">${state.workoutProgram.split.length}-day split</p>
                                </div>
                                <button onclick="showProgramSetup()" class="bg-white/20 hover:bg-white/30 px-4 py-2 rounded-lg text-sm font-medium">
                                    Edit Program
                                </button>
                            </div>
                            
                            <!-- Week Progress Bar -->
                            <div class="mt-4">
                                <div class="flex justify-between text-sm mb-1">
                                    <span>Program Progress</span>
                                    <span>${Math.round((currentWeek / state.workoutProgram.duration) * 100)}%</span>
                                </div>
                                <div class="bg-white/20 rounded-full h-2">
                                    <div class="bg-white h-2 rounded-full transition-all" 
                                        style="width: ${(currentWeek / state.workoutProgram.duration) * 100}%"></div>
                                </div>
                            </div>
                        </div>

                        <!-- This Week's Workouts -->
                        <div class="mb-6">
                            <h3 class="text-lg font-bold mb-3">This Week's Workouts</h3>
                            <div class="grid grid-cols-1 gap-3">
                                ${state.workoutProgram.split.map((day, index) => {
                                    const isCompleted = completedThisWeek[day];
                                    const dayLabels = ['Monday', 'Tuesday', 'Thursday', 'Friday'];
                                    
                                    return `
                                        <div class="bg-white rounded-lg shadow p-4 border-2 ${isCompleted ? 'border-green-500 bg-green-50' : 'border-gray-200'}">
                                            <div class="flex items-center justify-between mb-2">
                                                <div class="flex-1">
                                                    <div class="flex items-center gap-2">
                                                        <h4 class="font-bold text-gray-900">${day.split(' - ')[0]}</h4>
                                                        ${isCompleted ? '<span class="text-green-600">✓</span>' : ''}
                                                    </div>
                                                    <p class="text-sm text-gray-600">${dayLabels[index] || 'Flexible'}</p>
                                                    ${day.includes('(Big Box)') ? '<p class="text-xs text-blue-600 mt-1">📍 Big Box Gym</p>' : ''}
                                                </div>
                                                <button 
                                                    onclick="startSpecificWorkout('${day}')"
                                                    class="px-4 py-2 rounded-lg font-medium ${
                                                        isCompleted 
                                                            ? 'bg-green-100 text-green-700 hover:bg-green-200' 
                                                            : 'bg-blue-600 text-white hover:bg-blue-700'
                                                    }">
                                                    ${isCompleted ? 'Redo' : 'Start'}
                                                </button>
                                            </div>
                                            ${state.workoutProgram.programDetails?.[day] ? `
                                                <div class="text-xs text-gray-500 mt-2">
                                                    ${state.workoutProgram.programDetails[day].exercises.length} exercises
                                                </div>
                                            ` : ''}
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        </div>

                        <!-- Quick Actions -->
                        <div class="grid grid-cols-2 gap-3 mb-4">
                            <button onclick="showWorkoutHistory()" class="bg-gray-100 text-gray-700 py-3 px-4 rounded-lg font-medium hover:bg-gray-200">
                                📅 History
                            </button>
                            <button onclick="startCustomWorkout()" class="bg-gray-100 text-gray-700 py-3 px-4 rounded-lg font-medium hover:bg-gray-200">
                                ➕ Custom Workout
                            </button>
                        </div>
                    ` : `
                        <div class="bg-white rounded-lg shadow p-6 mb-4">
                            <h2 class="text-xl font-bold mb-4">Get Started</h2>
                            <button onclick="showProgramSetup()" class="w-full bg-blue-600 text-white py-3 px-4 rounded-lg font-medium hover:bg-blue-700 mb-3">
                                Set Up Training Program
                            </button>
                            <button onclick="startCustomWorkout()" class="w-full bg-green-600 text-white py-3 px-4 rounded-lg font-medium hover:bg-green-700">
                                Start Custom Workout
                            </button>
                        </div>
                    `}

                    ${renderRecentWorkouts()}
                </div>
            `;
        }

        function startSpecificWorkout(day) {
            const programTemplate = state.workoutProgram?.programDetails?.[day];
            const exercises = [];

            if (programTemplate?.exercises) {
                programTemplate.exercises.forEach(templateEx => {
                    const setsMatch = templateEx.sets.match(/^(\d+)/);
                    const numSets = setsMatch ? parseInt(setsMatch[1]) : 3;
                    
                    // Get last week's performance for this exercise
                    const lastPerformance = getLastPerformanceData(templateEx.name, day);
                    
                    // Create sets with last week's data if available
                    const sets = [];
                    for (let i = 0; i < numSets; i++) {
                        if (lastPerformance && lastPerformance[i]) {
                            // Use last week's data
                            sets.push({
                                weight: lastPerformance[i].weight || '',
                                reps: lastPerformance[i].reps || ''
                            });
                        } else {
                            // Empty set
                            sets.push({ weight: '', reps: '' });
                        }
                    }
                    
                    exercises.push({
                        name: templateEx.name,
                        sets: sets,
                        templateNotes: templateEx.notes || ''
                    });
                });
            }

            state.currentWorkout = {
                day,
                date: new Date().toISOString(),
                exercises: exercises,
                week: getCurrentWeek()
            };

            render();
        }

        function getLastPerformanceData(exerciseName, workoutDay) {
            // Find the most recent workout with this exercise
            const pastWorkouts = state.workouts
                .filter(w => w.day === workoutDay)
                .sort((a, b) => new Date(b.date) - new Date(a.date));
            
            for (let workout of pastWorkouts) {
                const exercise = workout.exercises.find(ex => ex.name === exerciseName);
                if (exercise && exercise.sets && exercise.sets.length > 0) {
                    // Return the sets data
                    return exercise.sets.filter(s => s.weight || s.reps);
                }
            }
            return null;
        }

        function startCustomWorkout() {
            const name = prompt('Workout name:');
            if (!name) return;

            state.currentWorkout = {
                day: name,
                date: new Date().toISOString(),
                exercises: [],
                week: getCurrentWeek()
            };

            render();
        }

        function showWorkoutHistory() {
            const overlay = document.createElement('div');
            overlay.className = 'fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 overflow-y-auto';
            
            // Group workouts by type
            const workoutsByType = {};
            state.workouts.forEach(workout => {
                if (!workoutsByType[workout.day]) {
                    workoutsByType[workout.day] = [];
                }
                workoutsByType[workout.day].push(workout);
            });
            
            // Sort each group by date (most recent first)
            Object.keys(workoutsByType).forEach(day => {
                workoutsByType[day].sort((a, b) => new Date(b.date) - new Date(a.date));
            });
            
            overlay.innerHTML = `
                <div class="bg-white rounded-lg max-w-3xl w-full max-h-[90vh] overflow-y-auto my-8">
                    <div class="sticky top-0 bg-white border-b p-6 z-10">
                        <div class="flex justify-between items-center">
                            <h2 class="text-2xl font-bold">Workout History</h2>
                            <button onclick="closeOverlay()" class="text-gray-500 hover:text-gray-700">
                                <span class="text-2xl">×</span>
                            </button>
                        </div>
                    </div>
                    
                    <div class="p-6">
                        ${Object.entries(workoutsByType).length === 0 ? `
                            <div class="text-center text-gray-500 py-8">
                                <p class="text-lg">No workouts logged yet</p>
                                <p class="text-sm mt-2">Complete your first workout to see it here!</p>
                            </div>
                        ` : `
                            ${Object.entries(workoutsByType).map(([day, workouts]) => `
                                <div class="mb-6">
                                    <h3 class="text-lg font-bold mb-3 flex items-center gap-2">
                                        ${day}
                                        <span class="text-sm font-normal text-gray-500">(${workouts.length} sessions)</span>
                                    </h3>
                                    <div class="space-y-3">
                                        ${workouts.slice(0, 10).map(workout => `
                                            <div class="bg-gray-50 rounded-lg p-4 border border-gray-200">
                                                <div class="flex justify-between items-start mb-3">
                                                    <div>
                                                        <div class="font-semibold">${new Date(workout.date).toLocaleDateString()}</div>
                                                        <div class="text-sm text-gray-600">Week ${workout.week} • ${workout.exercises.length} exercises</div>
                                                    </div>
                                                </div>
                                                
                                                <div class="space-y-2">
                                                    ${workout.exercises.map(ex => {
                                                        const totalVolume = ex.sets.reduce((sum, s) => 
                                                            sum + ((parseFloat(s.weight) || 0) * (parseFloat(s.reps) || 0)), 0
                                                        );
                                                        const maxWeight = Math.max(...ex.sets.map(s => parseFloat(s.weight) || 0));
                                                        
                                                        return `
                                                            <div class="text-sm">
                                                                <div class="font-medium text-gray-900">${ex.name}</div>
                                                                <div class="text-xs text-gray-600">
                                                                    ${ex.sets.filter(s => s.weight && s.reps).map(s => 
                                                                        `${s.weight} lbs × ${s.reps}`
                                                                    ).join(', ')}
                                                                </div>
                                                                ${ex.notes ? `
                                                                    <div class="text-xs text-purple-600 italic mt-1">📝 ${ex.notes}</div>
                                                                ` : ''}
                                                            </div>
                                                        `;
                                                    }).join('')}
                                                </div>
                                            </div>
                                        `).join('')}
                                        ${workouts.length > 10 ? `
                                            <div class="text-center text-sm text-gray-500">
                                                Showing 10 most recent sessions
                                            </div>
                                        ` : ''}
                                    </div>
                                </div>
                            `).join('')}
                        `}
                    </div>
                </div>
            `;
            
            document.body.appendChild(overlay);
            overlay.onclick = (e) => {
                if (e.target === overlay) closeOverlay();
            };
        }

        function renderProgramInfo() {
            if (!state.workoutProgram) return '';
            
            const { name, duration, split } = state.workoutProgram;
            const currentWeek = getCurrentWeek();
            
            return `
                <div class="bg-gradient-to-r from-purple-500 to-blue-500 text-white rounded-lg shadow-lg p-6 mb-4">
                    <div class="flex justify-between items-start mb-3">
                        <div>
                            <h3 class="text-2xl font-bold">${name}</h3>
                            <p class="text-purple-100 mt-1">${split.length}-day split • ${duration} weeks</p>
                        </div>
                        <button onclick="showProgramSetup()" class="text-white hover:bg-white/20 px-3 py-1 rounded">
                            Edit
                        </button>
                    </div>
                    <div class="bg-white/20 rounded-lg p-3">
                        <div class="text-sm text-purple-100 mb-1">Current Progress</div>
                        <div class="text-3xl font-bold">Week ${currentWeek} / ${duration}</div>
                    </div>
                </div>
            `;
        }

        function getCurrentWeek() {
            if (!state.workoutProgram || !state.workoutProgram.startDate) return 1;
            
            const start = new Date(state.workoutProgram.startDate);
            const now = new Date();
            
            // Get Monday of the start week
            const startMonday = new Date(start);
            startMonday.setDate(start.getDate() - start.getDay() + 1); // Move to Monday
            startMonday.setHours(0, 0, 0, 0);
            
            // Get Monday of current week
            const currentMonday = new Date(now);
            currentMonday.setDate(now.getDate() - now.getDay() + 1);
            currentMonday.setHours(0, 0, 0, 0);
            
            const diffTime = currentMonday - startMonday;
            const diffWeeks = Math.floor(diffTime / (1000 * 60 * 60 * 24 * 7));
            
            // Calculate week within 6-week cycle
            const weekInCycle = (diffWeeks % state.workoutProgram.duration) + 1;
            
            return weekInCycle;
        }

        function showProgramSetup() {
            const existing = state.workoutProgram || {};
            const overlay = document.createElement('div');
            overlay.className = 'fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4';

                        <div class="mb-4">

                            <input type="text" id="program-name" value="${existing.name || ''}"

                        <div class="mb-4">
                            <label class="block text-sm font-medium mb-2">Duration (weeks)</label>
