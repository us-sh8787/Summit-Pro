// ── STORAGE ───────────────────────────────────────────────────────────────────
const storage = {
    get: async (k) => {
        try { const r = await window.storage.get(k); return r ? JSON.parse(r.value) : null; }
        catch { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; }
    },
    set: async (k, v) => {
        try { await window.storage.set(k, JSON.stringify(v)); } catch {}
        localStorage.setItem(k, JSON.stringify(v));
    }
};

// ── STATE ─────────────────────────────────────────────────────────────────────
let state = {
    view: 'workout',
    workouts: [],
    habits: [],
    activeTimer: null,
    currentWorkout: null,
    program: null
};

// ── INIT ──────────────────────────────────────────────────────────────────────
async function init() {
    const [workouts, habits, program] = await Promise.all([
        storage.get('sp3-workouts'),
        storage.get('sp3-habits'),
        storage.get('sp3-program')
    ]);
    state.workouts = workouts || [];
    state.program  = program  || DEFAULT_PROGRAM;
    state.habits   = habits   || [
        { name:'💧 100oz Water',             frequency:'Daily', completions:[] },
        { name:'📖 Read 10 Pages / 15 Min', frequency:'Daily', completions:[] },
        { name:'☀️ 20 Min Sunlight',         frequency:'Daily', completions:[] },
        { name:'❤️ Show Wife Affection',     frequency:'Daily', completions:[] },
        { name:'💪 Resistance Training',     frequency:'Daily', completions:[] },
        { name:'⚡ Zone 5 Cardio',           frequency:'Daily', completions:[] },
        { name:'🧘 Morning Routine',         frequency:'Daily', completions:[] },
        { name:'🍎 Track Macros',            frequency:'Daily', completions:[] },
        { name:'🎾 Zone 2 (Tennis/Cardio)',  frequency:'Weekly-Range', completions:[], weeklyRange:{} }
    ];
    if (!habits) save();
    render();
}

function save() {
    storage.set('sp3-workouts', state.workouts);
    storage.set('sp3-habits',   state.habits);
    storage.set('sp3-program',  state.program);
}

// ── UTILS ─────────────────────────────────────────────────────────────────────
function mondayOf(d) {
    const r = new Date(d);
    r.setDate(d.getDate() - ((d.getDay()+6)%7));
    r.setHours(0,0,0,0);
    return r;
}
function getCurrentWeek() {
    if (!state.program?.startDate) return 1;
    const sm = mondayOf(new Date(state.program.startDate));
    const nm = mondayOf(new Date());
    const diff = Math.floor((nm - sm) / 604800000);
    return (diff % (state.program.duration || 6)) + 1;
}
function getWeekDates() {
    const mon = mondayOf(new Date());
    return Array.from({length:7}, (_,i) => {
        const d = new Date(mon); d.setDate(mon.getDate()+i); return d.toDateString();
    });
}
function getLastWorkout(dayName) {
    return [...state.workouts]
        .filter(w=>w.day===dayName)
        .sort((a,b)=>new Date(b.date)-new Date(a.date))[0] || null;
}
function getISOWeek(date) {
    const d = new Date(date); d.setHours(0,0,0,0);
    d.setDate(d.getDate()+3-((d.getDay()+6)%7));
    const w1 = new Date(d.getFullYear(),0,4);
    return `${d.getFullYear()}-W${String(Math.round(((d-w1)/86400000-3+(w1.getDay()+6)%7)/7)+1).padStart(2,'0')}`;
}

// ── RENDER ────────────────────────────────────────────────────────────────────
function render() {
    document.getElementById('app').innerHTML = renderHeader() + renderNav() + renderContent();
}
function switchView(v) { state.view=v; render(); }

function renderHeader() {
    return `<div style="background:#111;border-bottom:1px solid #242424;" class="p-5">
        <div class="flex items-center justify-between">
            <div>
                <h1 class="text-2xl font-black tracking-tight" style="color:#c8f542">SUMMIT PRO</h1>
                <p class="text-xs mt-0.5" style="color:#444">Push · Pull · Legs · Spring/Summer 2026</p>
            </div>
            <div class="text-right">
                <div class="text-xs" style="color:#444">WEEK</div>
                <div class="text-2xl font-black" style="color:#c8f542">${getCurrentWeek()}<span class="text-sm font-normal" style="color:#444">/${state.program?.duration||6}</span></div>
            </div>
        </div>
    </div>`;
}

function renderNav() {
    const tabs = [{id:'workout',label:'Workout',icon:'💪'},{id:'dashboard',label:'Stats',icon:'📊'},{id:'habits',label:'Habits',icon:'✓'}];
    return `<div style="background:#111;border-bottom:1px solid #242424;" class="sticky top-0 z-10">
        <div class="flex">
            ${tabs.map(t=>`<button onclick="switchView('${t.id}')" class="flex-1 py-3 text-center ${state.view===t.id?'border-b-2':''}"
                style="${state.view===t.id?'color:#c8f542;border-color:#c8f542;background:#161616;':'color:#555;'}">
                <div class="text-lg">${t.icon}</div>
                <div class="text-xs font-medium mt-0.5">${t.label}</div>
            </button>`).join('')}
        </div>
    </div>`;
}

function renderContent() {
    if (state.view==='workout')   return renderWorkoutView();
    if (state.view==='dashboard') return renderDashboardView();
    if (state.view==='habits')    return renderHabitsView();
    return '';
}

// ── WORKOUT HOME ──────────────────────────────────────────────────────────────
function renderWorkoutView() {
    if (state.currentWorkout) return renderActiveWorkout();

    });

                const done = doneThisWeek[day];
                const det = state.program?.programDetails?.[day];
                const dc = det?.color || '#c8f542';
                const last = getLastWorkout(day);
                const exCount = det?.blocks?.reduce((s,b)=>s+b.exercises.length,0)||0;
                return `<div class="day-card rounded-lg p-4 flex items-center justify-between"
                    style="background:#161616;border:1px solid ${done?dc:'#242424'};">
                    <div class="flex-1">
                        <div class="flex items-center gap-2 flex-wrap">
                            <div class="w-2 h-2 rounded-full flex-shrink-0" style="background:${dc}"></div>
                            <span class="font-black text-sm" style="color:${dc}">${day}</span>
                            <span class="text-xs" style="color:#444">${det?.dayLabel||''}</span>
                            ${done?`<span class="text-xs px-2 py-0.5 rounded-full font-medium" style="background:#1a2e00;color:#c8f542;">✓ Done</span>`:''}
                        </div>
                        <div class="text-xs mt-1 ml-4" style="color:#333">${exCount} exercises${last?' · Last: '+new Date(last.date).toLocaleDateString():''}</div>
                    </div>
                    <button onclick="startDay('${day}')" class="px-4 py-2 rounded-lg text-sm font-black ml-3 flex-shrink-0"
                        style="background:${done?'#1a1a1a':dc};color:${done?dc:'#000'};border:1px solid ${dc};">
                        ${done?'Redo':'Start'}
                    </button>
                </div>`;
            }).join('')}
        </div>
        <div class="grid grid-cols-2 gap-2 mb-4">
            <button onclick="showHistory()" class="py-3 rounded-lg text-sm font-medium" style="background:#161616;color:#555;border:1px solid #242424;">📅 History</button>
            <button onclick="startCustom()"  class="py-3 rounded-lg text-sm font-medium" style="background:#161616;color:#555;border:1px solid #242424;">➕ Custom</button>
        </div>
        ${renderRecentList()}
    </div>`;
}

                    <div class="text-sm font-medium">${w.day}</div>
                    <div class="text-xs" style="color:#333">${new Date(w.date).toLocaleDateString()} · Week ${w.week}</div>

            </div>`).join('')}

}

// ── START DAY ─────────────────────────────────────────────────────────────────
function startDay(dayName) {
    const det = state.program?.programDetails?.[dayName];
    if (!det) return;
    const last = getLastWorkout(dayName);
    const exercises = [];

    det.blocks.forEach(block => {
        block.exercises.forEach(ex => {
            const lastEx = last?.exercises?.find(e=>e.name===ex.name);
            if (ex.isCheckbox) {
                exercises.push({
                    name: ex.name, isCheckbox: true,
                    blockLabel: block.label, blockType: block.type,
                    sets: Array(ex.sets).fill(null).map(()=>({checked:false})),
                    detail: ex.reps, restSeconds: ex.rest,
                    tempo: ex.tempo,
                    templateNotes: ex.notes,
                    notes: lastEx?.notes||''
                });
            } else {
                const sets = Array(ex.sets).fill(null).map((_,i)=>({
                    weight: lastEx?.sets?.[i]?.weight||'',
                    reps:   lastEx?.sets?.[i]?.reps||''
                }));
                exercises.push({
                    name: ex.name, isCheckbox: false,
                    blockLabel: block.label, blockType: block.type,
                    sets, targetReps: ex.reps, restSeconds: ex.rest,
                    tempo: ex.tempo,
                    templateNotes: ex.notes,
                    notes: lastEx?.notes||'',
                    lastNotes: lastEx?.notes||null
                });
            }
        });
    });

    state.currentWorkout = {
        day: dayName, date: new Date().toISOString(),
        week: getCurrentWeek(), exercises, warmup: det.warmup,
        warmupChecked: Array(det.warmup?.length||0).fill(false)
    };
    render();
}

function startCustom() {
    const name = prompt('Workout name:');
    if (!name) return;
    state.currentWorkout = {
        day:name, date:new Date().toISOString(), week:getCurrentWeek(),
        exercises:[], warmup:[], warmupChecked:[]
    };
    render();
}

// ── REST TIMER ────────────────────────────────────────────────────────────────
function renderTimerEl() {
    const { remaining, total } = state.activeTimer;
    const prog = (1 - remaining/total) * 220;
    const m = Math.floor(remaining/60), s = remaining%60;
    return `<div class="rounded-lg p-4 mb-4 timer-pulse" style="background:#161616;border:1px solid #42c8f5;">
        <div class="flex items-center justify-between mb-2">
            <span class="text-sm font-bold" style="color:#42c8f5;">REST TIMER</span>
            <button onclick="stopTimer()" class="text-xs px-3 py-1 rounded" style="color:#f55;background:#1a0000;border:1px solid #300;">Stop</button>
        </div>
        <div class="flex items-center justify-center" style="position:relative;height:80px;">
            <svg width="80" height="80" style="position:absolute;transform:rotate(-90deg)">
                <circle cx="40" cy="40" r="35" stroke="#242424" stroke-width="6" fill="none"/>
                <circle cx="40" cy="40" r="35" stroke="#42c8f5" stroke-width="6" fill="none"
                    stroke-dasharray="220" stroke-dashoffset="${220-prog}" style="transition:stroke-dashoffset 1s linear;"/>
            </svg>
            <div class="text-2xl font-black" style="color:#42c8f5;position:relative;">${m}:${String(s).padStart(2,'0')}</div>
        </div>
    </div>`;
}

function startTimer(seconds) {
    if (state.activeTimer?.interval) clearInterval(state.activeTimer.interval);
    state.activeTimer = { total:seconds, remaining:seconds, interval:null };
    state.activeTimer.interval = setInterval(() => {
        state.activeTimer.remaining--;
        if (state.activeTimer.remaining <= 0) {
            stopTimer();
            if (navigator.vibrate) navigator.vibrate([200,100,200]);
        } else {
            const el = document.querySelector('.timer-pulse');
            if (el) {
                const { remaining:r, total:t } = state.activeTimer;
                const prog = (1-r/t)*220;
                const m=Math.floor(r/60), s=r%60;
                el.innerHTML = `
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-sm font-bold" style="color:#42c8f5;">REST TIMER</span>
                        <button onclick="stopTimer()" class="text-xs px-3 py-1 rounded" style="color:#f55;background:#1a0000;border:1px solid #300;">Stop</button>
                    </div>
                    <div class="flex items-center justify-center" style="position:relative;height:80px;">
                        <svg width="80" height="80" style="position:absolute;transform:rotate(-90deg)">
                            <circle cx="40" cy="40" r="35" stroke="#242424" stroke-width="6" fill="none"/>
                            <circle cx="40" cy="40" r="35" stroke="#42c8f5" stroke-width="6" fill="none"
                                stroke-dasharray="220" stroke-dashoffset="${220-prog}" style="transition:stroke-dashoffset 1s linear;"/>
                        </svg>
                        <div class="text-2xl font-black" style="color:#42c8f5;position:relative;">${m}:${String(s).padStart(2,'0')}</div>
                    </div>`;
            }
        }
    }, 1000);
    render();
}

function stopTimer() {
    if (state.activeTimer?.interval) clearInterval(state.activeTimer.interval);
    state.activeTimer = null;
    render();
}

// ── WORKOUT ACTIONS ───────────────────────────────────────────────────────────
function toggleWarmup(i) {
    state.currentWorkout.warmupChecked[i] = !state.currentWorkout.warmupChecked[i];
    render();
}
function toggleCheck(ei, si) {
    state.currentWorkout.exercises[ei].sets[si].checked = !state.currentWorkout.exercises[ei].sets[si].checked;
    const ex = state.currentWorkout.exercises[ei];
    if (state.currentWorkout.exercises[ei].sets[si].checked && ex.restSeconds > 0) startTimer(ex.restSeconds);
    else render();
}
function updateSet(ei, si, field, val) { state.currentWorkout.exercises[ei].sets[si][field] = val; }
function updateExNotes(ei, val) { state.currentWorkout.exercises[ei].notes = val; }
function addSet(ei) {
    const ex = state.currentWorkout.exercises[ei];
    ex.sets.push({ weight: ex.sets[ex.sets.length-1]?.weight||'', reps:'' });
    render();
}
function editExName(ei) {
    const n = prompt('Edit name:', state.currentWorkout.exercises[ei].name);
    if (n?.trim()) { state.currentWorkout.exercises[ei].name=n.trim(); render(); }
}
function addExercise() {
    const name = prompt('Exercise name:');
    if (!name) return;
    state.currentWorkout.exercises.push({
        name, isCheckbox:false, blockLabel:'CUSTOM', blockType:'superset',
        sets:[{weight:'',reps:''}], targetReps:'', restSeconds:60,
        tempo:'', templateNotes:'', notes:''
    });
    render();
}
async function finishWorkout() {
    if (!confirm('Finish workout?')) return;
    state.workouts.push({...state.currentWorkout});
    state.currentWorkout = null;
    stopTimer();
    await storage.set('sp3-workouts', state.workouts);
    render();
}
function cancelWorkout() {
    if (confirm('Cancel? Progress will be lost.')) {
        state.currentWorkout=null; stopTimer(); render();
    }
}

// ── DASHBOARD ─────────────────────────────────────────────────────────────────
function renderDashboardView() {
    const weekDates = getWeekDates();

        <div class="grid grid-cols-3 gap-3 mb-4">
            <div class="rounded-lg p-3 text-center" style="background:#161616;border:1px solid #242424;">

            </div>
            <div class="divide-y" style="border-color:#242424;">
                ${prList.map(([name,pr])=>`
                <div class="px-4 py-3 flex justify-between items-center">

                    <div class="text-right flex-shrink-0">
                        <div class="font-black" style="color:#c8f542">${pr.weight}lbs</div>

                </div>`).join('')}

        </div>` : ''}

        <div class="rounded-lg overflow-hidden" style="border:1px solid #242424;">
            <div class="px-4 py-3" style="background:#161616;border-bottom:1px solid #242424;">
                <span class="text-xs font-bold" style="color:#555;letter-spacing:2px;">SESSIONS BY DAY</span>
            </div>
            <div class="p-4 space-y-3">
                ${(state.program?.split||[]).map(day=>{

        <div class="flex justify-between items-center mb-4">
            <div>
                <h2 class="text-xs font-bold" style="color:#444;letter-spacing:2px;">HABITS</h2>
                <div class="text-xs mt-0.5" style="color:#555">${doneToday}/${dailyHabits.length} daily done today</div>
            </div>
            <button onclick="addHabit()" class="text-xs px-3 py-1.5 rounded-lg font-bold" style="background:#c8f542;color:#000;">+ Add</button>
        </div>
        <div class="space-y-2">
            ${state.habits.map((h,i)=>renderHabitRow(h,i,today,weekDates)).join('')}
        </div>
    </div>`;
}

function renderHabitRow(habit, i, today, weekDates) {
    if (habit.frequency === 'Weekly-Range') {
        const weekKey = weekDates[0];
        const current = habit.weeklyRange?.[weekKey] || null;
        const ranges = ['< 120 min','120–180 min','181+ min'];
        return `<div class="rounded-lg p-4" style="background:#161616;border:1px solid ${current?'#c8f542':'#242424'};">
            <div class="flex items-start justify-between mb-3">
                <div>
                    <div class="font-medium text-sm">${habit.name}</div>
                    <div class="text-xs mt-0.5" style="color:#444">Weekly total Zone 2 minutes</div>
                </div>
                <button onclick="removeHabit(${i})" class="text-lg leading-none ml-2" style="color:#333;">×</button>
            </div>
            <div class="grid grid-cols-3 gap-2">
                ${ranges.map(r=>`<button onclick="setZone2(${i},'${r}')"
                    class="py-2 rounded-lg text-xs font-bold"
                    style="${current===r?'background:#c8f542;color:#000;':'background:#1a1a1a;color:#555;border:1px solid #333;'}">
                    ${r}
                </button>`).join('')}
            </div>
            ${current?`<div class="text-xs mt-2" style="color:#6a8a00;">✓ This week: ${current}</div>`:''}
        </div>`;
    }

    const done = habit.completions?.includes(today);
    return `<div class="rounded-lg px-4 py-3 flex items-center justify-between"
        style="background:#161616;border:1px solid ${done?'#c8f542':'#242424'};">
        <div class="flex-1">
            <div class="text-sm font-medium">${habit.name}</div>
        </div>
        <div class="flex items-center gap-3 ml-3">
            <button onclick="toggleHabit(${i})"
                class="w-10 h-10 rounded-lg font-bold text-lg flex-shrink-0 transition-all"
                style="${done?'background:#c8f542;color:#000;':'background:#1a1a1a;color:#444;border:1px solid #333;'}">
                ${done?'✓':'○'}
            </button>
            <button onclick="removeHabit(${i})" class="text-lg leading-none flex-shrink-0" style="color:#333;">×</button>
        </div>
    </div>`;
}

function setZone2(i, range) {
    const weekKey = getWeekDates()[0];
    if (!state.habits[i].weeklyRange) state.habits[i].weeklyRange = {};
    if (state.habits[i].weeklyRange[weekKey] === range) delete state.habits[i].weeklyRange[weekKey];
    else state.habits[i].weeklyRange[weekKey] = range;
    save(); render();
}
function toggleHabit(i) {
    const today = new Date().toDateString();
    if (!state.habits[i].completions) state.habits[i].completions=[];
    const idx = state.habits[i].completions.indexOf(today);
    if (idx>-1) state.habits[i].completions.splice(idx,1);
    else state.habits[i].completions.push(today);
    save(); render();
}
function removeHabit(i) {
    if (confirm('Remove habit?')) { state.habits.splice(i,1); save(); render(); }
}
function addHabit() {
    const overlay = document.createElement('div');
    overlay.className = 'fixed inset-0 z-50 flex items-center justify-center p-4 overlay-bg';
    overlay.innerHTML = `<div class="w-full max-w-md rounded-xl p-6" style="background:#161616;border:1px solid #333;">
        <h3 class="text-lg font-black mb-4" style="color:#c8f542;">ADD HABIT</h3>
        <input type="text" id="h-name" placeholder="Habit name" class="w-full px-3 py-2 rounded-lg mb-4 text-sm"
            style="background:#1a1a1a;border:1px solid #333;color:#e8e8e8;">
        <div class="flex gap-3">
            <button onclick="saveHabit()" class="flex-1 py-2 rounded-lg font-bold text-sm" style="background:#c8f542;color:#000;">Add</button>
            <button onclick="this.closest('.fixed').remove()" class="flex-1 py-2 rounded-lg text-sm" style="background:#1a1a1a;color:#888;border:1px solid #333;">Cancel</button>
        </div>
    </div>`;
    document.body.appendChild(overlay);
}
function saveHabit() {
    const name = document.getElementById('h-name').value;
    if (!name) { alert('Enter a name'); return; }
    state.habits.push({ name, frequency:'Daily', completions:[] });
    save();
    document.querySelector('.fixed.inset-0').remove();
    render();
}

init();
</script>
</body>
</html>
